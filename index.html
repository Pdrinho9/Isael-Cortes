<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isael Alves Cortes - Gestão Premium</title>
    <link rel="icon" type="image/png" href="Logo.png" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; scroll-behavior: smooth; padding-bottom: 100px; background: #000000; color: #cbd5e1; }
        .glass { background: rgba(18, 18, 18, 0.8); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .active-tab { background: #ffffff !important; color: #000000 !important; font-weight: 900; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 500; align-items: center; justify-content: center; backdrop-filter: blur(12px); padding: 20px; }
        #modal-bloqueio-total { display: flex; z-index: 999; } 
        input[type="date"] { color-scheme: dark; }
        .collapsible-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; }
        .collapsible-content.open { max-height: 3000px; transition: max-height 0.6s ease-in; }
        .rotate-icon { transition: transform 0.3s; }
        .rotated { transform: rotate(180deg); }
    </style>
</head>
<body class="min-h-screen">

    <div id="modal-bloqueio-total" class="modal">
        <div class="glass p-8 rounded-[2.5rem] w-full max-w-xs text-center border-white/20">
            <img src="Logo.png" class="w-20 h-20 mx-auto mb-6 rounded-full border border-white/10">
            <h3 class="text-xl font-black text-white mb-2 italic uppercase">Acesso Restrito</h3>
            <input type="password" id="input-senha-entrada" placeholder="Senha..." class="w-full bg-black border border-white/10 rounded-2xl p-4 text-white text-center text-xl mb-6 outline-none">
            <button onclick="verificarSenhaEntrada()" class="w-full py-4 bg-white text-black rounded-xl font-black uppercase text-xs">Acessar</button>
        </div>
    </div>

    <div id="modal-senha" class="modal">
        <div class="glass p-8 rounded-[2.5rem] w-full max-w-xs text-center">
            <h3 class="text-xl font-black text-white mb-4 italic uppercase">Área do Dono</h3>
            <input type="password" id="input-senha-admin" placeholder="••••" class="w-full bg-black border border-white/10 rounded-2xl p-4 text-white text-center text-2xl mb-6 outline-none">
            <div class="flex gap-3">
                <button onclick="fecharModais()" class="flex-1 py-3 text-slate-500 font-bold text-xs uppercase">Sair</button>
                <button onclick="confirmarSenhaAdmin()" class="flex-1 py-3 bg-white text-black rounded-xl font-black uppercase text-xs">Liberar</button>
            </div>
        </div>
    </div>

    <div id="modal-editor" class="modal">
        <div class="glass p-8 rounded-[3rem] w-full max-w-md border-white/10">
            <h3 id="editor-titulo" class="text-2xl font-black text-white mb-6 text-center italic uppercase">Editor</h3>
            <div id="seletor-tipo" class="flex gap-2 mb-6" style="display: none;">
                <button onclick="setTipoNovoItem('Serviço')" id="tipo-servico" class="flex-1 py-3 rounded-xl border border-white/10 text-[10px] font-black uppercase">Serviço</button>
                <button onclick="setTipoNovoItem('Produto')" id="tipo-produto" class="flex-1 py-3 rounded-xl border border-white/10 text-[10px] font-black uppercase">Produto</button>
            </div>
            <div id="editor-campos" class="space-y-4"></div>
            <div class="flex flex-col gap-3 mt-10">
                <div class="flex gap-3">
                    <button onclick="fecharModais()" class="flex-1 py-4 bg-white/5 rounded-2xl font-bold text-xs text-slate-500 uppercase">Cancelar</button>
                    <button id="btn-salvar-editor" class="flex-1 py-4 bg-white text-black rounded-2xl font-black uppercase text-xs">Salvar</button>
                </div>
                <button id="btn-excluir-item" class="w-full py-3 text-rose-600 font-bold text-[10px] uppercase border border-rose-600/20 rounded-xl">Remover</button>
            </div>
        </div>
    </div>

    <div class="flex min-h-screen">
        <aside class="w-72 bg-black border-r border-white/5 p-8 hidden lg:flex flex-col sticky top-0 h-screen z-50">
            <img src="Logo.png" class="w-24 h-24 rounded-full mx-auto mb-10 border border-white/10">
            <nav class="space-y-3 flex-1">
                <button onclick="switchTab('vendas')" id="btn-vendas" class="nav-btn w-full flex items-center gap-4 px-6 py-4 rounded-2xl font-black active-tab"><i data-lucide="plus-square"></i> NOVO</button>
                <button onclick="switchTab('dashboard')" id="btn-dashboard" class="nav-btn w-full flex items-center gap-4 px-6 py-4 rounded-2xl font-bold text-slate-500 hover:bg-white/5 text-left"><i data-lucide="bar-chart-3"></i> PAINEL</button>
                <button onclick="switchTab('financeiro')" id="btn-financeiro" class="nav-btn w-full flex items-center gap-4 px-6 py-4 rounded-2xl font-bold text-slate-500 hover:bg-white/5 text-left"><i data-lucide="wallet"></i> GASTOS</button>
                <button onclick="switchTab('clientes')" id="btn-clientes" class="nav-btn w-full flex items-center gap-4 px-6 py-4 rounded-2xl font-bold text-slate-500 hover:bg-white/5 text-left"><i data-lucide="users"></i> CLIENTES</button>
                <button onclick="switchTab('estoque')" id="btn-estoque" class="nav-btn w-full flex items-center gap-4 px-6 py-4 rounded-2xl font-bold text-slate-500 hover:bg-white/5 text-left"><i data-lucide="package"></i> ESTOQUE</button>
                <button onclick="switchTab('config')" id="btn-config" class="nav-btn w-full flex items-center gap-4 px-6 py-4 rounded-2xl font-bold text-slate-500 hover:bg-white/5 text-left"><i data-lucide="settings"></i> EQUIPE</button>
            </nav>
        </aside>

        <main class="flex-1 p-4 lg:p-16">
            <div id="tab-vendas" class="tab-content">
                <div class="max-w-xl mx-auto glass p-8 lg:p-14 rounded-[3rem]">
                    <h3 class="text-2xl font-black text-white mb-8 text-center uppercase italic">Novo Lançamento</h3>
                    <form id="form-venda" class="space-y-5">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <select id="venda-barbeiro" class="bg-black border border-white/10 p-4 rounded-2xl text-white outline-none font-bold" required></select>
                            <select id="venda-cliente" class="bg-black border border-white/10 p-4 rounded-2xl text-white outline-none italic"></select>
                        </div>
                        <div class="flex flex-col md:flex-row gap-2">
                            <input type="text" id="venda-descricao" list="lista-itens-datalist" oninput="atualizarPrecoAutomatico()" placeholder="Item ou Serviço..." class="flex-1 bg-black border border-white/10 p-4 rounded-2xl text-white outline-none font-bold">
                            <div class="flex gap-2">
                                <input type="number" id="venda-qtd" value="1" min="1" class="w-20 bg-black border border-white/10 p-4 rounded-2xl text-white text-center font-bold outline-none">
                                <button type="button" onclick="adicionarItemAoCarrinho()" class="bg-white text-black px-6 py-4 rounded-2xl font-black text-xl">+</button>
                            </div>
                        </div>
                        <datalist id="lista-itens-datalist"></datalist>
                        <div id="carrinho-venda" class="space-y-2 hidden border-y border-white/5 py-4"></div>
                        <div class="grid grid-cols-2 gap-4">
                            <input type="number" id="venda-valor" placeholder="R$ Total" step="0.01" class="bg-black border border-white/10 p-4 rounded-2xl text-white outline-none font-black" required>
                            <select id="venda-pagamento" class="bg-black border border-white/10 p-4 rounded-2xl text-white outline-none font-bold" required>
                                <option value="">Pagamento...</option><option value="Pix">Pix</option><option value="Cartão">Cartão</option><option value="Dinheiro">Dinheiro</option>
                            </select>
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="text-[9px] text-slate-500 font-black uppercase ml-2 italic">Data do Lançamento <span id="msg-lock" class="text-rose-500">(Admin)</span></label>
                            <input type="date" id="venda-data-retroativa" disabled class="w-full bg-black border border-white/10 p-4 rounded-2xl text-white font-bold outline-none italic">
                        </div>
                        <button type="submit" id="btn-finalizar-venda" class="w-full py-5 bg-white text-black font-black rounded-2xl uppercase shadow-xl">Finalizar</button>
                    </form>
                </div>
            </div>

            <div id="tab-dashboard" class="tab-content hidden">
                <header class="flex flex-col gap-4 mb-8">
                    <div class="flex justify-between items-center w-full">
                        <h2 class="text-2xl font-black text-white uppercase italic">Painel</h2>
                        <div class="flex gap-2">
                            <input type="date" id="filtro-data" onchange="renderizarTudo()" class="bg-white/5 border border-white/10 text-white text-[10px] p-2 rounded-xl">
                            <input type="date" id="filtro-data-fim" onchange="renderizarTudo()" class="bg-white/5 border border-white/10 text-white text-[10px] p-2 rounded-xl">
                        </div>
                    </div>
                </header>

                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8 text-center">
                    <div class="glass p-6 rounded-3xl"><p class="text-[9px] text-slate-500 uppercase">Bruto</p><h4 id="dash-faturamento" class="text-xl font-black text-white italic">R$ 0,00</h4></div>
                    <div class="glass p-6 rounded-3xl"><p class="text-[9px] text-emerald-500 uppercase font-black">Comissões</p><h4 id="dash-comissoes" class="text-xl font-black text-emerald-500 italic">R$ 0,00</h4></div>
                    <div class="glass p-6 rounded-3xl"><p class="text-[9px] text-blue-400 uppercase font-black">Produtos</p><h4 id="dash-produtos-total" class="text-xl font-black text-blue-400 italic">R$ 0,00</h4></div>
                    <div class="glass p-6 rounded-3xl"><p class="text-[9px] text-rose-500 uppercase font-black">Casa</p><h4 id="dash-casa" class="text-xl font-black text-rose-500 italic">R$ 0,00</h4></div>
                </div>
                <div id="log-vendas-agrupado" class="space-y-4"></div>
            </div>

            <div id="tab-financeiro" class="tab-content hidden">
                <div class="flex justify-between items-center mb-8">
                    <h3 class="text-2xl font-black text-white uppercase italic">Gastos</h3>
                    <button onclick="abrirEditor('novo_gasto')" class="bg-rose-600 text-white px-4 py-2 rounded-xl font-black text-[10px] uppercase italic">ADICIONAR +</button>
                </div>
                <div id="lista-gastos" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>

            <div id="tab-clientes" class="tab-content hidden">
                <div class="flex justify-between items-center mb-8"><h3 class="text-2xl font-black text-white uppercase italic">Clientes</h3><button onclick="abrirEditor('novo_cliente')" class="bg-white text-black px-4 py-2 rounded-xl font-black text-[10px] uppercase italic">NOVO +</button></div>
                <div id="lista-completa-clientes" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
            </div>

            <div id="tab-estoque" class="tab-content hidden">
                <div class="flex justify-between items-center mb-8">
                    <h3 class="text-2xl font-black text-white uppercase italic">Estoque</h3>
                    <button onclick="abrirEditor('novo_produto')" class="bg-white text-black px-4 py-2 rounded-xl font-black text-[10px] uppercase italic">NOVO +</button>
                </div>
                
                <p class="text-[10px] text-slate-500 font-black uppercase mb-4 italic tracking-widest">— Serviços</p>
                <div id="lista-servicos" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-10"></div>
                
                <p class="text-[10px] text-slate-500 font-black uppercase mb-4 italic tracking-widest">— Produtos</p>
                <div id="lista-produtos" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-10"></div>

                <div class="glass overflow-hidden rounded-[2.5rem] border-blue-500/10">
                    <button onclick="toggleAccordion('acc-estoque', 'icon-est')" class="w-full p-8 flex justify-between items-center bg-white/5">
                        <div class="flex items-center gap-3">
                            <i data-lucide="trending-up" class="text-blue-400"></i>
                            <h3 class="text-xl font-black text-white uppercase italic">Vendas por Produto</h3>
                        </div>
                        <i data-lucide="chevron-down" id="icon-est" class="rotate-icon text-white"></i>
                    </button>
                    <div id="acc-estoque" class="collapsible-content">
                        <div class="p-8 pt-0">
                            <div class="flex gap-2 mb-6">
                                <input type="date" id="filtro-estoque-inicio" onchange="renderizarTudo()" class="flex-1 bg-black border border-white/10 text-white text-[10px] p-2 rounded-xl outline-none">
                                <input type="date" id="filtro-estoque-fim" onchange="renderizarTudo()" class="flex-1 bg-black border border-white/10 text-white text-[10px] p-2 rounded-xl outline-none">
                            </div>
                            <div id="relatorio-vendas-produtos" class="space-y-3"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="tab-config" class="tab-content hidden">
                <h3 class="text-2xl font-black text-white mb-8 text-center uppercase italic">Equipe</h3>
                <div id="lista-equipe" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8"></div>
                <button onclick="abrirEditor('novo_barbeiro')" class="w-full max-w-md mx-auto block py-4 border border-white/10 rounded-xl font-black text-[10px] text-white uppercase italic">ADICIONAR BARBEIRO</button>
            </div>
        </main>
    </div>

    <div class="lg:hidden fixed bottom-0 left-0 right-0 glass border-t border-white/5 px-2 py-3 flex justify-around items-center z-[450] rounded-t-[2rem]">
        <button onclick="switchTab('vendas')" class="text-white p-2"><i data-lucide="plus-circle"></i></button>
        <button onclick="switchTab('dashboard')" class="text-slate-600 p-2"><i data-lucide="layout-grid"></i></button>
        <button onclick="switchTab('financeiro')" class="text-slate-600 p-2"><i data-lucide="wallet"></i></button>
        <button onclick="switchTab('clientes')" class="text-slate-600 p-2"><i data-lucide="users"></i></button>
        <button onclick="switchTab('estoque')" class="text-slate-600 p-2"><i data-lucide="package"></i></button>
        <button onclick="switchTab('config')" class="text-slate-600 p-2"><i data-lucide="settings"></i></button>
    </div>

    <script>
        const _supabase = supabase.createClient("https://uijaesuqgnchafnrvnih.supabase.co", "sb_publishable_Ukmk4J2mCb_CRhdgs_qKWA_Z0c5WIgG");
        const SENHA_ENTRADA = "cortoupagou", SENHA_ADMIN = "81120824";
        let DB = { vendas: [], clientes: [], estoque: [], barbeiros: [], gastos: [] }, carrinhoTemporario = [];
        const hoje = new Date().toISOString().split('T')[0];
        const TABELA_GANHOS = { "corte": 20.00, "corte barba": 32.50, "corte + barba": 32.50, "corte sobrancelha": 25.00, "pezinho": 10.00, "barba": 15.00, "sobrancelha": 7.50, "alisante": 12.50, "luzes": 25.00 };

        document.addEventListener('DOMContentLoaded', () => {
            ['filtro-data', 'filtro-data-fim', 'venda-data-retroativa', 'filtro-estoque-inicio', 'filtro-estoque-fim'].forEach(id => {
                if(document.getElementById(id)) document.getElementById(id).value = hoje;
            });
            lucide.createIcons();
        });

        async function carregar() { const { data } = await _supabase.from('barbearia').select('*').eq('id', 1).single(); if (data) { DB = data; renderizarTudo(); } }
        async function salvar() { const { error } = await _supabase.from('barbearia').update(DB).match({ id: 1 }); return !error; }

        function toggleAccordion(id, iconId) {
            const content = document.getElementById(id); const icon = document.getElementById(iconId);
            content.classList.toggle('open'); if(icon) icon.classList.toggle('rotated');
        }

        function switchTab(t) {
            if(['dashboard', 'estoque', 'config', 'financeiro', 'clientes'].includes(t) && sessionStorage.getItem('is_admin') !== 'true') {
                abaDestinoPendente = t; document.getElementById('modal-senha').style.display = 'flex'; return;
            }
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            document.getElementById('tab-' + t).classList.remove('hidden');
            fecharModais(); lucide.createIcons();
        }

        function renderizarTudo() {
            const dS = document.getElementById('filtro-data').value, dF = document.getElementById('filtro-data-fim').value, logA = document.getElementById('log-vendas-agrupado');
            logA.innerHTML = ''; let fatG = 0, comG = 0, prodG = 0;
            const vFiltradas = (DB.vendas || []).filter(v => v.data >= dS && v.data <= dF);

            (DB.barbeiros || []).forEach((barb, bIdx) => {
                const vB = vFiltradas.filter(v => v.barbeiro === barb.nome);
                if(vB.length === 0) return;
                let fatB = 0, comB = 0, pB = 0, htmlV = '';
                vB.forEach(v => {
                    const val = parseFloat(v.valor); fatB += val; comB += calcularComissao(v.descricao);
                    v.descricao.split(',').forEach(pedaco => {
                        let n = pedaco.trim(); if(n.includes('x ')) n = n.split('x ')[1].trim();
                        const itemE = DB.estoque.find(e => e.nome.toLowerCase() === n.toLowerCase());
                        if(itemE && itemE.tipo === 'Produto') pB += val;
                    });
                    htmlV += `<div class="flex justify-between items-center p-4 bg-white/5 mb-1 rounded-xl italic">
                        <div class="text-[10px]"><span class="text-white font-black uppercase">${v.cliente}</span><p class="text-slate-500">${v.descricao}</p></div>
                        <div class="flex items-center gap-3">
                            <p class="font-black text-white text-xs">R$ ${val.toFixed(2)}</p>
                            <button onclick="abrirEditor('venda', ${DB.vendas.indexOf(v)})" class="text-slate-700"><i data-lucide="edit-3" size="14"></i></button>
                        </div>
                    </div>`;
                });
                fatG += fatB; comG += comB; prodG += pB;
                logA.innerHTML += `<div class="glass overflow-hidden rounded-[2rem]">
                    <button onclick="toggleAccordion('acc-b-${bIdx}', 'ic-b-${bIdx}')" class="w-full bg-white/5 p-5 flex justify-between items-center">
                        <div class="text-left"><h4 class="text-white font-black italic uppercase text-sm">${barb.nome}</h4><p class="text-[9px] text-emerald-500">Pagar: R$ ${comB.toFixed(2)}</p></div>
                        <div class="flex items-center gap-4"><p class="text-white font-black text-lg">R$ ${fatB.toFixed(2)}</p><i data-lucide="chevron-down" id="ic-b-${bIdx}" class="rotate-icon text-slate-500"></i></div>
                    </button>
                    <div id="acc-b-${bIdx}" class="collapsible-content"><div>${htmlV}</div></div>
                </div>`;
            });

            // Relatório Produtos Retrátil
            const relProd = document.getElementById('relatorio-vendas-produtos');
            if(relProd) {
                relProd.innerHTML = ''; const cont = {};
                (DB.vendas || []).filter(v => v.data >= document.getElementById('filtro-estoque-inicio').value && v.data <= document.getElementById('filtro-estoque-fim').value).forEach(v => {
                    v.descricao.split(',').forEach(p => {
                        let n = p.trim(), q = 1; if(n.includes('x ')) { const a = n.split('x '); q = parseInt(a[0]) || 1; n = a[1].trim(); }
                        cont[n] = (cont[n] || 0) + q;
                    });
                });
                Object.keys(cont).forEach(nome => {
                    const item = DB.estoque.find(e => e.nome.toLowerCase() === nome.toLowerCase());
                    relProd.innerHTML += `<div class="flex justify-between p-3 bg-white/5 rounded-xl border border-white/5 text-[10px]">
                        <span>${nome} (${cont[nome]} un)</span><span class="text-blue-400 font-bold">R$ ${(item ? item.preco * cont[nome] : 0).toFixed(2)}</span>
                    </div>`;
                });
            }

            document.getElementById('dash-faturamento').innerText = "R$ " + fatG.toFixed(2);
            document.getElementById('dash-comissoes').innerText = "R$ " + comG.toFixed(2);
            document.getElementById('dash-produtos-total').innerText = "R$ " + prodG.toFixed(2);
            document.getElementById('dash-casa').innerText = "R$ " + (fatG - comG).toFixed(2);
            document.getElementById('venda-barbeiro').innerHTML = '<option value="">Barbeiro...</option>' + DB.barbeiros.map(b => `<option value="${b.nome}">${b.nome}</option>`).join('');
            document.getElementById('venda-cliente').innerHTML = '<option value="Consumidor">Cliente...</option>' + DB.clientes.map(c => `<option value="${c.nome}">${c.nome}</option>`).join('');
            document.getElementById('lista-itens-datalist').innerHTML = (DB.estoque || []).map(i => `<option value="${i.nome}">`).join('');
            
            renderizarListasSecundarias(); lucide.createIcons();
        }

        function renderizarListasSecundarias() {
            const cL = document.getElementById('lista-completa-clientes'); if(cL) {
                cL.innerHTML = (DB.clientes || []).map(c => `<div class="glass p-5 rounded-3xl flex justify-between items-center"><div><p class="font-black text-white text-xs uppercase italic">${c.nome}</p></div><button onclick="abrirEditor('cliente', ${c.id})" class="text-slate-600"><i data-lucide="edit-3" size="16"></i></button></div>`).join('');
            }
            const sL = document.getElementById('lista-servicos'); if(sL) {
                sL.innerHTML = (DB.estoque || []).filter(i => i.tipo === 'Serviço').map(i => `<div class="glass p-4 rounded-2xl flex justify-between"><div><p class="text-[10px] font-black uppercase italic">${i.nome}</p><p class="text-white font-bold text-xs">R$ ${parseFloat(i.preco).toFixed(2)}</p></div><button onclick="abrirEditor('produto', ${i.id})" class="text-slate-600"><i data-lucide="edit-3" size="16"></i></button></div>`).join('');
            }
            const pL = document.getElementById('lista-produtos'); if(pL) {
                pL.innerHTML = (DB.estoque || []).filter(i => i.tipo === 'Produto').map(i => `<div class="glass p-4 rounded-2xl flex justify-between"><div><p class="text-[10px] font-black uppercase italic">${i.nome}</p><p class="text-white font-bold text-xs">R$ ${parseFloat(i.preco).toFixed(2)}</p></div><button onclick="abrirEditor('produto', ${i.id})" class="text-emerald-500 font-black">${i.quantidade || 0}</button></div>`).join('');
            }
            const gL = document.getElementById('lista-gastos'); if(gL) {
                gL.innerHTML = (DB.gastos || []).map((g, idx) => `<div class="glass p-4 rounded-2xl flex justify-between"><div><p class="text-[10px] font-black uppercase italic">${g.descricao}</p><p class="text-rose-500 font-bold text-xs">R$ ${parseFloat(g.valor).toFixed(2)}</p></div><button onclick="abrirEditor('gasto', ${idx})" class="text-slate-600"><i data-lucide="edit-3" size="16"></i></button></div>`).join('');
            }
            const eL = document.getElementById('lista-equipe'); if(eL) {
                eL.innerHTML = (DB.barbeiros || []).map((b, idx) => `<div class="glass p-5 rounded-3xl flex justify-between items-center"><div><p class="font-black text-white text-xs uppercase italic">${b.nome}</p></div><button onclick="abrirEditor('barbeiro', ${idx})" class="text-slate-600"><i data-lucide="edit-3" size="16"></i></button></div>`).join('');
            }
        }

        function abrirEditor(tipo, idIdx = null) {
            const c = document.getElementById('editor-campos'); const t = document.getElementById('editor-titulo');
            const btnDel = document.getElementById('btn-excluir-item'); const btnSalvar = document.getElementById('btn-salvar-editor');
            const selTipo = document.getElementById('seletor-tipo');
            c.innerHTML = ''; document.getElementById('modal-editor').style.display = 'flex'; btnDel.style.display = idIdx !== null ? 'block' : 'none'; selTipo.style.display = 'none';

            if(tipo === 'cliente' || tipo === 'novo_cliente') {
                const cli = idIdx !== null ? DB.clientes.find(c => c.id === idIdx) : {nome:''};
                t.innerText = "CLIENTE"; c.innerHTML = `<input type="text" id="ed-1" value="${cli.nome}" placeholder="Nome..." class="w-full bg-black border border-white/10 p-4 rounded-xl text-white outline-none">`;
                btnSalvar.onclick = async () => { if(tipo === 'novo_cliente') DB.clientes.push({id: Date.now(), nome: document.getElementById('ed-1').value}); else { const i = DB.clientes.findIndex(c => c.id === idIdx); DB.clientes[i].nome = document.getElementById('ed-1').value; } await salvar(); fecharModais(); renderizarTudo(); };
                btnDel.onclick = async () => { DB.clientes = DB.clientes.filter(c => c.id !== idIdx); await salvar(); fecharModais(); renderizarTudo(); };
            } else if(tipo === 'produto' || tipo === 'novo_produto') {
                selTipo.style.display = 'flex'; const prod = idIdx !== null ? DB.estoque.find(p => p.id === idIdx) : {nome:'', preco:'', quantidade:0, tipo:tipoItemSelecionado};
                t.innerText = "ITEM"; c.innerHTML = `<input type="text" id="ed-1" value="${prod.nome}" placeholder="Nome..." class="w-full bg-black border border-white/10 p-4 rounded-xl text-white mb-2"><input type="number" id="ed-2" value="${prod.preco}" placeholder="Preço..." class="w-full bg-black border border-white/10 p-4 rounded-xl text-white mb-2"><input type="number" id="ed-3" value="${prod.quantidade}" placeholder="Estoque..." class="w-full bg-black border border-white/10 p-4 rounded-xl text-white">`;
                btnSalvar.onclick = async () => { if(tipo === 'novo_produto') DB.estoque.push({id: Date.now(), nome: document.getElementById('ed-1').value, preco: document.getElementById('ed-2').value, quantidade: document.getElementById('ed-3').value, tipo: tipoItemSelecionado}); else { const i = DB.estoque.findIndex(p => p.id === idIdx); DB.estoque[i] = {...DB.estoque[i], nome: document.getElementById('ed-1').value, preco: document.getElementById('ed-2').value, quantidade: document.getElementById('ed-3').value}; } await salvar(); fecharModais(); renderizarTudo(); };
                btnDel.onclick = async () => { DB.estoque = DB.estoque.filter(p => p.id !== idIdx); await salvar(); fecharModais(); renderizarTudo(); };
            } else if(tipo === 'barbeiro' || tipo === 'novo_barbeiro') {
                const b = idIdx !== null ? DB.barbeiros[idIdx] : {nome:''};
                t.innerText = "BARBEIRO"; c.innerHTML = `<input type="text" id="ed-1" value="${b.nome}" class="w-full bg-black border border-white/10 p-4 rounded-xl text-white">`;
                btnSalvar.onclick = async () => { if(tipo === 'novo_barbeiro') DB.barbeiros.push({nome: document.getElementById('ed-1').value}); else DB.barbeiros[idIdx].nome = document.getElementById('ed-1').value; await salvar(); fecharModais(); renderizarTudo(); };
                btnDel.onclick = async () => { DB.barbeiros.splice(idIdx, 1); await salvar(); fecharModais(); renderizarTudo(); };
            } else if(tipo === 'gasto' || tipo === 'novo_gasto') {
                const g = idIdx !== null ? DB.gastos[idIdx] : {descricao:'', valor:'', data:hoje};
                t.innerText = "GASTO"; c.innerHTML = `<input type="text" id="ed-1" value="${g.descricao}" placeholder="Descrição..." class="w-full bg-black border border-white/10 p-4 rounded-xl text-white mb-2"><input type="number" id="ed-2" value="${g.valor}" placeholder="Valor..." class="w-full bg-black border border-white/10 p-4 rounded-xl text-white mb-2"><input type="date" id="ed-3" value="${g.data}" class="w-full bg-black border border-white/10 p-4 rounded-xl text-white">`;
                btnSalvar.onclick = async () => { if(tipo === 'novo_gasto') DB.gastos.push({descricao: document.getElementById('ed-1').value, valor: document.getElementById('ed-2').value, data: document.getElementById('ed-3').value}); else DB.gastos[idIdx] = {descricao: document.getElementById('ed-1').value, valor: document.getElementById('ed-2').value, data: document.getElementById('ed-3').value}; await salvar(); fecharModais(); renderizarTudo(); };
                btnDel.onclick = async () => { DB.gastos.splice(idIdx, 1); await salvar(); fecharModais(); renderizarTudo(); };
            } else if(tipo === 'venda') {
                const v = DB.vendas[idIdx]; t.innerText = "EDITAR VENDA";
                c.innerHTML = `<input type="text" id="ed-1" value="${v.descricao}" class="w-full bg-black border border-white/10 p-4 rounded-xl text-white mb-2"><input type="number" id="ed-2" value="${v.valor}" class="w-full bg-black border border-white/10 p-4 rounded-xl text-white mb-2"><input type="date" id="ed-3" value="${v.data}" class="w-full bg-black border border-white/10 p-4 rounded-xl text-white">`;
                btnSalvar.onclick = async () => { DB.vendas[idIdx] = {...v, descricao: document.getElementById('ed-1').value, valor: document.getElementById('ed-2').value, data: document.getElementById('ed-3').value}; await salvar(); fecharModais(); renderizarTudo(); };
                btnDel.onclick = async () => { DB.vendas.splice(idIdx, 1); await salvar(); fecharModais(); renderizarTudo(); };
            }
        }

        function setTipoNovoItem(t) { 
            tipoItemSelecionado = t; 
            document.getElementById('tipo-servico').className = t === 'Serviço' ? 'flex-1 py-3 rounded-xl bg-white text-black font-black text-[10px]' : 'flex-1 py-3 rounded-xl border border-white/10 text-white text-[10px]';
            document.getElementById('tipo-produto').className = t === 'Produto' ? 'flex-1 py-3 rounded-xl bg-white text-black font-black text-[10px]' : 'flex-1 py-3 rounded-xl border border-white/10 text-white text-[10px]';
        }

        function adicionarItemAoCarrinho() {
            const d = document.getElementById('venda-descricao'), q = document.getElementById('venda-qtd'), v = document.getElementById('venda-valor');
            if(!d.value) return; const qtd = parseInt(q.value) || 1; const precoU = parseFloat(v.value) || 0;
            carrinhoTemporario.push({ nome: qtd > 1 ? `${qtd}x ${d.value}` : d.value, preco: precoU * qtd, original: d.value, qtd: qtd });
            d.value = ''; q.value = '1'; atualizarVisualCarrinho();
        }

        function atualizarVisualCarrinho() {
            const cont = document.getElementById('carrinho-venda'), t = document.getElementById('venda-valor');
            if(carrinhoTemporario.length === 0) { cont.classList.add('hidden'); t.value = ''; return; }
            cont.classList.remove('hidden'); let total = 0;
            cont.innerHTML = carrinhoTemporario.map((item, idx) => { total += item.preco; return `<div class="flex justify-between items-center bg-white/5 p-3 rounded-xl italic text-[10px]"><span>${item.nome}</span><button type="button" onclick="carrinhoTemporario.splice(${idx},1);atualizarVisualCarrinho()" class="text-rose-500">x</button></div>`; }).join('');
            t.value = total.toFixed(2);
        }

        document.getElementById('form-venda').addEventListener('submit', async function(e) {
            e.preventDefault(); if(carrinhoTemporario.length === 0) return;
            DB.vendas.push({ barbeiro: document.getElementById('venda-barbeiro').value, cliente: document.getElementById('venda-cliente').value, descricao: carrinhoTemporario.map(i => i.nome).join(', '), valor: document.getElementById('venda-valor').value, pagamento: document.getElementById('venda-pagamento').value, data: document.getElementById('venda-data-retroativa').value || hoje });
            // Baixar estoque
            carrinhoTemporario.forEach(item => {
                const iEst = DB.estoque.findIndex(e => e.nome.toLowerCase() === item.original.toLowerCase() && e.tipo === 'Produto');
                if(iEst !== -1) DB.estoque[iEst].quantidade = (parseInt(DB.estoque[iEst].quantidade) || 0) - item.qtd;
            });
            if(await salvar()) { this.reset(); carrinhoTemporario = []; atualizarVisualCarrinho(); renderizarTudo(); alert("Venda Salva!"); }
        });

        function calcularComissao(desc) {
            let t = 0; desc.split(',').forEach(p => {
                let n = p.trim().toLowerCase(); let m = 1; if(n.includes('x ')) { const a = n.split('x '); m = parseInt(a[0]) || 1; n = a[1].trim(); }
                if(TABELA_GANHOS[n]) t += (TABELA_GANHOS[n] * m);
            }); return t;
        }

        function verificarSenhaEntrada() { if(document.getElementById('input-senha-entrada').value === SENHA_ENTRADA) { document.getElementById('modal-bloqueio-total').style.display = 'none'; sessionStorage.setItem('acesso', 'true'); carregar(); } }
        function confirmarSenhaAdmin() { if(document.getElementById('input-senha-admin').value === SENHA_ADMIN) { sessionStorage.setItem('is_admin', 'true'); document.getElementById('venda-data-retroativa').disabled = false; switchTab(abaDestinoPendente); } }
        function fecharModais() { document.querySelectorAll('.modal').forEach(m => { if(m.id !== 'modal-bloqueio-total') m.style.display = 'none'; }); }
        function atualizarPrecoAutomatico() { const i = DB.estoque.find(i => i.nome.toLowerCase() === document.getElementById('venda-descricao').value.toLowerCase()); if(i) document.getElementById('venda-valor').value = i.preco; }

        window.onload = () => { document.getElementById('modal-bloqueio-total').style.display = 'flex'; };
    </script>
</body>
</html>
