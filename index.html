<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isael Alves Cortes - Gestão Premium</title>
    <link rel="icon" type="image/png" href="Logo.png" />
    <link rel="apple-touch-icon" href="Logo.png" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; scroll-behavior: smooth; padding-bottom: 100px; background: #000000; color: #cbd5e1; }
        .glass { background: rgba(18, 18, 18, 0.8); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .active-tab { background: #ffffff !important; color: #000000 !important; font-weight: 900; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 500; align-items: center; justify-content: center; backdrop-filter: blur(12px); padding: 20px; }
        #modal-bloqueio-total { display: flex; z-index: 999; } 
        .brand-logo { width: 120px; height: 120px; object-fit: cover; border-radius: 50%; border: 2px solid rgba(255,255,255,0.1); margin: 0 auto 2rem auto; display: block; }
        input[type="date"] { color-scheme: dark; cursor: pointer; }
        @media (max-width: 1024px) { .brand-logo { width: 90px; height: 90px; margin-bottom: 1rem; } }
        @media (min-width: 1024px) { body { padding-bottom: 0; } }
    </style>
</head>
<body class="min-h-screen">

    <div id="modal-bloqueio-total" class="modal">
        <div class="glass p-8 rounded-[2.5rem] w-full max-w-xs text-center border-white/20">
            <img src="Logo.png" alt="Logo" class="w-20 h-20 mx-auto mb-6 rounded-full border border-white/10">
            <h3 class="text-xl font-black text-white mb-2 italic uppercase">Acesso Restrito</h3>
            <input type="password" id="input-senha-entrada" placeholder="Senha..." class="w-full bg-black border border-white/10 rounded-2xl p-4 text-white text-center text-xl mb-6 outline-none">
            <button onclick="verificarSenhaEntrada()" class="w-full py-4 bg-white text-black rounded-xl font-black uppercase text-xs">Acessar</button>
        </div>
    </div>

    <div id="modal-senha" class="modal">
        <div class="glass p-8 rounded-[2.5rem] w-full max-w-xs text-center">
            <h3 class="text-xl font-black text-white mb-4 italic uppercase">Área do Dono</h3>
            <input type="password" id="input-senha-admin" placeholder="••••" class="w-full bg-black border border-white/10 rounded-2xl p-4 text-white text-center text-2xl mb-6 outline-none">
            <div class="flex gap-3">
                <button onclick="fecharModais()" class="flex-1 py-3 text-slate-500 font-bold text-xs uppercase">Sair</button>
                <button onclick="confirmarSenhaAdmin()" class="flex-1 py-3 bg-white text-black rounded-xl font-black uppercase text-xs">Liberar</button>
            </div>
        </div>
    </div>

    <div id="modal-editor" class="modal">
        <div class="glass p-8 rounded-[3rem] w-full max-w-md border-white/10">
            <h3 id="editor-titulo" class="text-2xl font-black text-white mb-6 text-center italic uppercase">Editor</h3>
            <div id="seletor-tipo" class="flex gap-2 mb-6" style="display: none;">
                <button onclick="setTipoNovoItem('Serviço')" id="tipo-servico" class="flex-1 py-3 rounded-xl border border-white/10 text-[10px] font-black uppercase">Serviço</button>
                <button onclick="setTipoNovoItem('Produto')" id="tipo-produto" class="flex-1 py-3 rounded-xl border border-white/10 text-[10px] font-black uppercase">Produto</button>
            </div>
            <div id="editor-campos" class="space-y-4"></div>
            <div class="flex flex-col gap-3 mt-10">
                <div class="flex gap-3">
                    <button onclick="fecharModais()" class="flex-1 py-4 bg-white/5 rounded-2xl font-bold text-xs text-slate-500 uppercase">Cancelar</button>
                    <button id="btn-salvar-editor" class="flex-1 py-4 bg-white text-black rounded-2xl font-black uppercase text-xs">Salvar</button>
                </div>
                <button id="btn-excluir-item" class="w-full py-3 text-rose-600 font-bold text-[10px] uppercase border border-rose-600/20 rounded-xl">Remover</button>
            </div>
        </div>
    </div>

    <div class="flex min-h-screen">
        <aside class="w-72 bg-black border-r border-white/5 p-8 hidden lg:flex flex-col sticky top-0 h-screen z-50">
            <img src="Logo.png" alt="Logo" class="brand-logo">
            <nav class="space-y-3 flex-1">
                <button onclick="switchTab('vendas')" id="btn-vendas" class="nav-btn w-full flex items-center gap-4 px-6 py-4 rounded-2xl font-black active-tab"><i data-lucide="plus-square"></i> NOVO</button>
                <button onclick="switchTab('dashboard')" id="btn-dashboard" class="nav-btn w-full flex items-center gap-4 px-6 py-4 rounded-2xl font-bold text-slate-500 hover:bg-white/5 text-left"><i data-lucide="bar-chart-3"></i> PAINEL</button>
                <button onclick="switchTab('financeiro')" id="btn-financeiro" class="nav-btn w-full flex items-center gap-4 px-6 py-4 rounded-2xl font-bold text-slate-500 hover:bg-white/5 text-left"><i data-lucide="wallet"></i> FINANCEIRO</button>
                <button onclick="switchTab('clientes')" id="btn-clientes" class="nav-btn w-full flex items-center gap-4 px-6 py-4 rounded-2xl font-bold text-slate-500 hover:bg-white/5 text-left"><i data-lucide="users"></i> CLIENTES</button>
                <button onclick="switchTab('estoque')" id="btn-estoque" class="nav-btn w-full flex items-center gap-4 px-6 py-4 rounded-2xl font-bold text-slate-500 hover:bg-white/5 text-left"><i data-lucide="package"></i> ESTOQUE</button>
                <button onclick="switchTab('config')" id="btn-config" class="nav-btn w-full flex items-center gap-4 px-6 py-4 rounded-2xl font-bold text-slate-500 hover:bg-white/5 text-left"><i data-lucide="settings"></i> EQUIPE</button>
            </nav>
        </aside>

        <main class="flex-1 p-4 lg:p-16">
            <div id="tab-vendas" class="tab-content">
                <div class="max-w-xl mx-auto glass p-8 rounded-[3rem]">
                    <h3 class="text-2xl font-black text-white mb-8 text-center uppercase italic">Novo Lançamento</h3>
                    <form id="form-venda" class="space-y-5">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <select id="venda-barbeiro" class="bg-black border border-white/10 p-4 rounded-2xl text-white font-bold outline-none" required></select>
                            <select id="venda-cliente" class="bg-black border border-white/10 p-4 rounded-2xl text-white outline-none italic"></select>
                        </div>
                        <div class="flex gap-2">
                            <input type="text" id="venda-descricao" list="lista-itens-datalist" oninput="atualizarPrecoAutomatico()" placeholder="Item ou Serviço..." class="flex-1 bg-black border border-white/10 p-4 rounded-2xl text-white font-bold outline-none">
                            <input type="number" id="venda-qtd" value="1" min="1" class="w-20 bg-black border border-white/10 p-4 rounded-2xl text-white text-center font-bold outline-none">
                            <button type="button" onclick="adicionarItemAoCarrinho()" class="bg-white text-black px-6 rounded-2xl font-black text-xl">+</button>
                        </div>
                        <datalist id="lista-itens-datalist"></datalist>
                        <div id="carrinho-venda" class="space-y-2 hidden border-y border-white/5 py-4"></div>
                        <div class="grid grid-cols-2 gap-4">
                            <input type="number" id="venda-valor" placeholder="R$ Total" step="0.01" class="bg-black border border-white/10 p-4 rounded-2xl text-white font-black outline-none" required>
                            <select id="venda-pagamento" class="bg-black border border-white/10 p-4 rounded-2xl text-white font-bold outline-none" required>
                                <option value="">Pagamento...</option><option value="Pix">Pix</option><option value="Cartão">Cartão</option><option value="Dinheiro">Dinheiro</option>
                            </select>
                        </div>
                        <input type="date" id="venda-data-retroativa" disabled class="w-full bg-black border border-white/10 p-4 rounded-2xl text-white font-bold outline-none italic">
                        <button type="submit" id="btn-finalizar-venda" class="w-full py-5 bg-white text-black font-black rounded-2xl uppercase">Finalizar</button>
                    </form>
                </div>
            </div>

            <div id="tab-dashboard" class="tab-content hidden">
                <header class="mb-8 flex flex-col gap-4">
                    <div class="flex justify-between items-center">
                        <h2 class="text-2xl font-black text-white uppercase italic">Painel</h2>
                        <select id="filtro-tempo" onchange="toggleFiltroData()" class="bg-white text-black text-[10px] font-black rounded-xl px-4 py-2 uppercase italic">
                            <option value="dia">Por Data</option><option value="periodo">Por Período</option><option value="total">Geral</option>
                        </select>
                    </div>
                    <div id="area-filtros-data" class="flex gap-2">
                        <input type="date" id="filtro-data" onchange="renderizarTudo()" class="flex-1 bg-black border border-white/10 text-white text-center text-[10px] font-black rounded-xl p-3 outline-none italic">
                        <input type="date" id="filtro-data-fim" onchange="renderizarTudo()" class="flex-1 bg-black border border-white/10 text-white text-center text-[10px] font-black rounded-xl p-3 outline-none italic hidden">
                    </div>
                </header>
                <div id="log-vendas-agrupado" class="space-y-4"></div>
            </div>

            <div id="tab-estoque" class="tab-content hidden">
                <div class="flex justify-between items-center mb-8">
                    <h3 class="text-2xl font-black text-white uppercase italic">Estoque</h3>
                    <button onclick="abrirEditor('novo_produto')" class="bg-white text-black px-4 py-2 rounded-xl font-black text-[10px] uppercase">NOVO +</button>
                </div>
                
                <div id="lista-servicos" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-10"></div>
                <div id="lista-produtos" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-10"></div>

                <div class="glass p-6 rounded-[2.5rem] border-blue-500/10">
                    <div class="flex flex-wrap justify-between items-center gap-4 mb-6">
                        <h3 class="text-xl font-black text-white uppercase italic">Vendas por Período</h3>
                        <div class="flex gap-2">
                            <input type="date" id="estoque-data-i" onchange="renderizarRelatorioEstoque()" class="bg-black border border-white/10 text-[10px] text-white p-2 rounded-lg outline-none font-bold">
                            <input type="date" id="estoque-data-f" onchange="renderizarRelatorioEstoque()" class="bg-black border border-white/10 text-[10px] text-white p-2 rounded-lg outline-none font-bold">
                        </div>
                    </div>
                    <div id="relatorio-vendas-produtos" class="space-y-3"></div>
                </div>
            </div>
            
            <div id="tab-financeiro" class="tab-content hidden"><div id="lista-gastos" class="grid grid-cols-1 gap-4"></div></div>
            <div id="tab-clientes" class="tab-content hidden"><div id="lista-completa-clientes" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div></div>
            <div id="tab-config" class="tab-content hidden"><div id="lista-equipe" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div></div>
        </main>
    </div>

    <div class="lg:hidden fixed bottom-0 left-0 right-0 glass border-t border-white/5 px-2 py-3 flex justify-around items-center z-[450] rounded-t-[2rem]">
        <button onclick="switchTab('vendas')" class="text-white p-2"><i data-lucide="plus-circle"></i></button>
        <button onclick="switchTab('dashboard')" class="text-slate-600 p-2"><i data-lucide="layout-grid"></i></button>
        <button onclick="switchTab('estoque')" class="text-slate-600 p-2"><i data-lucide="package"></i></button>
        <button onclick="switchTab('financeiro')" class="text-slate-600 p-2"><i data-lucide="wallet"></i></button>
        <button onclick="switchTab('config')" class="text-slate-600 p-2"><i data-lucide="settings"></i></button>
    </div>
    <script>
    lucide.createIcons();
    // Configurações de Conexão e Senhas
    const _supabase = supabase.createClient("https://uijaesuqgnchafnrvnih.supabase.co", "sb_publishable_Ukmk4J2mCb_CRhdgs_qKWA_Z0c5WIgG");
    const SENHA_ENTRADA = "cortoupagou";
    const SENHA_ADMIN = "81120824";

    let DB = { vendas: [], clientes: [], estoque: [], barbeiros: [], gastos: [] };
    let carrinhoTemporario = [];
    let tipoItemSelecionado = 'Serviço';
    const hoje = new Date().toISOString().split('T')[0];

    // --- FUNÇÕES DE INTERFACE ---

    function toggleAcordion(id) {
        const el = document.getElementById(id);
        const icon = document.getElementById('icon-' + id);
        if (el.classList.contains('hidden')) {
            el.classList.remove('hidden');
            if(icon) icon.style.transform = 'rotate(180deg)';
        } else {
            el.classList.add('hidden');
            if(icon) icon.style.transform = 'rotate(0deg)';
        }
    }

    function toggleFiltroData() {
        const modo = document.getElementById('filtro-tempo').value;
        document.getElementById('filtro-data-fim').classList.toggle('hidden', modo !== 'periodo');
        renderizarTudo();
    }

    function switchTab(t) {
        if(['dashboard', 'estoque', 'config', 'financeiro'].includes(t)) {
            if(sessionStorage.getItem('is_admin') === 'true') {
                executarTrocaTab(t);
            } else {
                abaDestinoPendente = t;
                document.getElementById('modal-senha').style.display = 'flex';
            }
        } else {
            executarTrocaTab(t);
        }
    }

    function executarTrocaTab(t) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
        document.getElementById('tab-' + t).classList.remove('hidden');
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active-tab', 'text-slate-500'));
        const btn = document.getElementById('btn-' + t);
        if(btn) btn.classList.add('active-tab');
        fecharModais();
        lucide.createIcons();
    }

    function fecharModais() {
        document.querySelectorAll('.modal').forEach(m => {
            if(m.id !== 'modal-bloqueio-total') m.style.display = 'none';
        });
    }

    // --- SEGURANÇA ---

    function verificarSenhaEntrada() {
        if(document.getElementById('input-senha-entrada').value === SENHA_ENTRADA) {
            document.getElementById('modal-bloqueio-total').style.display = 'none';
            sessionStorage.setItem('acesso_concedido', 'true');
        } else { alert("Senha incorreta!"); }
    }

    let abaDestinoPendente = 'vendas';
    function confirmarSenhaAdmin() {
        if(document.getElementById('input-senha-admin').value === SENHA_ADMIN) {
            sessionStorage.setItem('is_admin', 'true');
            document.getElementById('venda-data-retroativa').disabled = false;
            executarTrocaTab(abaDestinoPendente);
            renderizarTudo();
        } else { alert("Acesso Negado!"); }
    }

    // --- BANCO DE DADOS ---

    async function carregar() {
        const { data } = await _supabase.from('barbearia').select('*').eq('id', 1).single();
        if (data) { 
            DB = data; 
            if(!DB.gastos) DB.gastos = [];
            renderizarTudo(); 
        }
    }

    async function salvar() {
        try {
            const { error } = await _supabase.from('barbearia').update(DB).match({ id: 1 });
            return !error;
        } catch (e) { return false; }
    }

    // --- LÓGICA DE VENDAS ---

    function calcularComissao(descricao) {
        const TABELA_GANHOS = {
            "corte": 20.00, "corte barba": 32.50, "corte + barba": 32.50, "corte sobrancelha": 25.00, "corte + sobrancelha": 25.00,
            "pezinho": 10.00, "barba": 15.00, "sobrancelha": 7.50, "alisante": 12.50, "corte sombra alisante": 35.00, "corte + sombra + alisante": 35.00,
            "luzes": 25.00, "corte alisante/ pigmentado": 32.50, "corte + alisante/ pigmentado": 32.50, "corte luzes": 42.50, "corte + luzes": 42.50
        };
        let total = 0;
        descricao.split(',').forEach(p => {
            let nome = p.trim().toLowerCase();
            let mult = 1;
            if (nome.includes('x ')) {
                const aux = nome.split('x ');
                mult = parseInt(aux[0]) || 1;
                nome = aux[1].trim();
            }
            if (TABELA_GANHOS[nome] !== undefined) total += (TABELA_GANHOS[nome] * mult);
        });
        return total;
    }

    function atualizarPrecoAutomatico() {
        const item = DB.estoque.find(i => i.nome.toLowerCase() === document.getElementById('venda-descricao').value.toLowerCase());
        if(item) document.getElementById('venda-valor').value = item.preco;
    }

    function adicionarItemAoCarrinho() {
        const d = document.getElementById('venda-descricao');
        const q = document.getElementById('venda-qtd');
        const v = document.getElementById('venda-valor');
        if(!d.value) return;
        const qtd = parseInt(q.value) || 1;
        const precoUnit = parseFloat(v.value) || 0;
        carrinhoTemporario.push({ nome: qtd > 1 ? `${qtd}x ${d.value}` : d.value, preco: precoUnit * qtd, original: d.value, qtd: qtd });
        d.value = ''; q.value = '1';
        atualizarVisualCarrinho();
    }

    function atualizarVisualCarrinho() {
        const cont = document.getElementById('carrinho-venda');
        const t = document.getElementById('venda-valor');
        if(carrinhoTemporario.length === 0) { cont.classList.add('hidden'); t.value = ''; return; }
        cont.classList.remove('hidden');
        let total = 0;
        cont.innerHTML = carrinhoTemporario.map((item, idx) => {
            total += item.preco;
            return `<div class="flex justify-between items-center bg-white/5 p-3 rounded-xl italic text-[10px]">
                <span>${item.nome}</span>
                <button type="button" onclick="removerItemCarrinho(${idx})" class="text-rose-500"><i data-lucide="x" size="14"></i></button>
            </div>`;
        }).join('');
        t.value = total.toFixed(2);
        lucide.createIcons();
    }

    function removerItemCarrinho(idx) {
        carrinhoTemporario.splice(idx, 1);
        atualizarVisualCarrinho();
    }

    document.getElementById('form-venda').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('btn-finalizar-venda');
        if(carrinhoTemporario.length === 0) return;
        btn.disabled = true; btn.innerText = "SALVANDO...";
        
        const dataVenda = document.getElementById('venda-data-retroativa').value || hoje;
        
        DB.vendas.push({
            barbeiro: document.getElementById('venda-barbeiro').value,
            cliente: document.getElementById('venda-cliente').value,
            descricao: carrinhoTemporario.map(i => i.nome).join(', '),
            valor: document.getElementById('venda-valor').value,
            pagamento: document.getElementById('venda-pagamento').value,
            data: dataVenda
        });

        // Baixa estoque
        carrinhoTemporario.forEach(item => {
            const idx = DB.estoque.findIndex(e => e.nome.toLowerCase() === item.original.toLowerCase());
            if(idx !== -1 && DB.estoque[idx].tipo === 'Produto') {
                DB.estoque[idx].quantidade = (DB.estoque[idx].quantidade || 0) - item.qtd;
            }
        });

        if(await salvar()) {
            this.reset();
            carrinhoTemporario = [];
            atualizarVisualCarrinho();
            renderizarTudo();
            alert("Venda registrada!");
        }
        btn.disabled = false; btn.innerText = "FINALIZAR";
    });

    // --- RENDERIZAÇÃO ---

    function renderizarTudo() {
        // Renderizar Filtros do Painel
        const filtroT = document.getElementById('filtro-tempo').value;
        const dataS = document.getElementById('filtro-data').value;
        const dataF = document.getElementById('filtro-data-fim').value;
        const logA = document.getElementById('log-vendas-agrupado');
        logA.innerHTML = '';

        const vFiltradas = (DB.vendas || []).filter(v => {
            if(filtroT === 'total') return true;
            if(filtroT === 'dia') return v.data === dataS;
            return v.data >= dataS && v.data <= dataF;
        });

        // Painel por Barbeiro (com Accordion)
        (DB.barbeiros || []).forEach((barb, idx) => {
            const vB = vFiltradas.filter(v => v.barbeiro === barb.nome);
            if(vB.length === 0) return;
            
            let fatB = 0, comB = 0, htmlV = '';
            vB.forEach(v => {
                const val = parseFloat(v.valor); fatB += val;
                const cV = calcularComissao(v.descricao); comB += cV;
                htmlV += `<div class="p-4 border-b border-white/5 flex justify-between items-center text-[10px]">
                    <div><p class="text-white uppercase font-black">${v.cliente}</p><p class="text-slate-500">${v.descricao}</p></div>
                    <p class="text-white font-bold italic">R$ ${val.toFixed(2)}</p>
                </div>`;
            });

            const idColl = 'coll-barb-' + idx;
            logA.innerHTML += `
                <div class="glass overflow-hidden rounded-[2rem] mb-4">
                    <div onclick="toggleAcordion('${idColl}')" class="bg-white/5 p-5 flex justify-between items-center cursor-pointer">
                        <div class="flex items-center gap-2">
                            <i data-lucide="chevron-down" id="icon-${idColl}" class="text-slate-500 transition-transform"></i>
                            <h4 class="text-white font-black uppercase italic">${barb.nome}</h4>
                        </div>
                        <div class="flex gap-4">
                            <div class="text-right border-l border-white/10 pl-4"><p class="text-[8px] text-emerald-500 font-black uppercase">Pagar</p><p class="text-emerald-500 font-black italic text-sm">R$ ${comB.toFixed(2)}</p></div>
                            <div class="text-right border-l border-white/10 pl-4"><p class="text-[8px] text-rose-500 font-black uppercase">Casa</p><p class="text-rose-500 font-black italic text-sm">R$ ${(fatB-comB).toFixed(2)}</p></div>
                        </div>
                    </div>
                    <div id="${idColl}" class="hidden bg-black/20">${htmlV}</div>
                </div>`;
        });

        // Populando Datalists e Selects
        document.getElementById('venda-barbeiro').innerHTML = '<option value="">Barbeiro...</option>' + DB.barbeiros.map(b => `<option value="${b.nome}">${b.nome}</option>`).join('');
        document.getElementById('venda-cliente').innerHTML = '<option value="Consumidor">Cliente...</option>' + DB.clientes.map(c => `<option value="${c.nome}">${c.nome}</option>`).join('');
        document.getElementById('lista-itens-datalist').innerHTML = DB.estoque.map(i => `<option value="${i.nome}">`).join('');

        renderizarListasSecundarias();
        renderizarRelatorioEstoque();
        lucide.createIcons();
    }

    function renderizarRelatorioEstoque() {
        const dataI = document.getElementById('estoque-data-i').value;
        const dataF = document.getElementById('estoque-data-f').value;
        const container = document.getElementById('relatorio-vendas-produtos');
        if(!container) return;

        const contagem = {};
        DB.vendas.forEach(v => {
            if(v.data >= dataI && v.data <= dataF) {
                v.descricao.split(',').forEach(p => {
                    let n = p.trim(); let q = 1;
                    if(n.includes('x ')) { const a = n.split('x '); q = parseInt(a[0]) || 1; n = a[1].trim(); }
                    if(!contagem[n]) contagem[n] = { q: 0, r: 0 };
                    contagem[n].q += q;
                    const item = DB.estoque.find(e => e.nome.toLowerCase() === n.toLowerCase());
                    if(item) contagem[n].r += (parseFloat(item.preco) * q);
                });
            }
        });

        const keys = Object.keys(contagem).sort((a,b) => contagem[b].q - contagem[a].q);
        container.innerHTML = keys.length ? '' : '<p class="text-[10px] text-slate-600 text-center py-4">Sem vendas no período</p>';
        keys.forEach((nome, idx) => {
            const idRel = 'rel-prod-' + idx;
            container.innerHTML += `
                <div class="bg-white/5 rounded-2xl overflow-hidden mb-2">
                    <div onclick="toggleAcordion('${idRel}')" class="p-4 flex justify-between items-center cursor-pointer">
                        <div class="flex items-center gap-2"><i data-lucide="chevron-down" id="icon-${idRel}" class="text-slate-500 transition-transform"></i><p class="text-white font-black text-xs uppercase italic">${nome}</p></div>
                        <p class="text-blue-400 font-black italic text-sm">${contagem[nome].q} un</p>
                    </div>
                    <div id="${idRel}" class="hidden p-4 bg-black/40 border-t border-white/5">
                        <p class="text-[8px] text-slate-500 font-black uppercase">Rendimento Bruto</p>
                        <p class="text-emerald-500 font-black text-lg italic">R$ ${contagem[nome].r.toFixed(2)}</p>
                    </div>
                </div>`;
        });
        lucide.createIcons();
    }
