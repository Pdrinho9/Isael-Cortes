<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isael Alves Cortes - Gestão Master</title>
    <link rel="icon" type="image/png" href="Logo.png" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #050505; color: #cbd5e1; padding-bottom: 110px; }
        .glass { background: rgba(15, 15, 15, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .active-tab { background: #ffffff !important; color: #000000 !important; font-weight: 900; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.96); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(12px); padding: 20px; }
        .card-item { background: #111; border: 1px solid rgba(255,255,255,0.05); transition: 0.2s; }
        .card-item:hover { border-color: rgba(255,255,255,0.15); }
    </style>
</head>
<body>

    <div id="modal-bloqueio-total" class="modal" style="display: flex;">
        <div class="glass p-10 rounded-[3rem] w-full max-w-sm text-center border-white/10">
            <img src="Logo.png" class="w-24 h-24 rounded-full mx-auto mb-6 border-2 border-white/10">
            <input type="password" id="input-senha-entrada" placeholder="SENHA" class="w-full bg-black border border-white/10 rounded-2xl p-5 text-white text-center font-black mb-6 outline-none">
            <button onclick="verificarSenhaEntrada()" class="w-full py-5 bg-white text-black rounded-2xl font-black uppercase">Entrar</button>
        </div>
    </div>

    <div id="modal-senha" class="modal">
        <div class="glass p-8 rounded-[2.5rem] w-full max-w-xs text-center border-white/20">
            <h3 class="text-white font-black mb-4 uppercase italic">Admin</h3>
            <input type="password" id="input-senha-admin" placeholder="••••" class="w-full bg-black border border-white/10 rounded-2xl p-5 text-white text-center text-3xl mb-6 outline-none">
            <div class="flex gap-3">
                <button onclick="fecharModais()" class="flex-1 py-4 text-slate-500 font-bold text-[10px] uppercase">Sair</button>
                <button onclick="confirmarSenhaAdmin()" class="flex-1 py-4 bg-white text-black rounded-xl font-black uppercase text-[10px]">Liberar</button>
            </div>
        </div>
    </div>

    <div id="modal-editor" class="modal">
        <div class="glass p-8 rounded-[2.5rem] w-full max-w-md">
            <h3 id="editor-titulo" class="text-xl font-black text-white mb-6 uppercase italic text-center italic">Editar Registro</h3>
            <div id="editor-campos" class="space-y-4"></div>
            <div class="flex gap-3 mt-8">
                <button onclick="fecharModais()" class="flex-1 py-4 bg-white/5 rounded-2xl font-bold text-slate-500 uppercase text-[10px]">Cancelar</button>
                <button id="btn-salvar-editor" class="flex-1 py-4 bg-white text-black rounded-2xl font-black uppercase text-[10px]">Salvar</button>
            </div>
        </div>
    </div>

    <div class="flex min-h-screen">
        <aside class="w-72 bg-black border-r border-white/5 p-8 hidden lg:flex flex-col sticky top-0 h-screen">
            <img src="Logo.png" class="w-24 h-24 rounded-full mx-auto mb-10 border border-white/10">
            <nav class="space-y-3 flex-1">
                <button onclick="switchTab('vendas')" id="btn-vendas" class="nav-btn w-full flex items-center gap-4 px-6 py-4 rounded-2xl font-black active-tab"><i data-lucide="plus-square"></i> NOVA VENDA</button>
                <button onclick="switchTab('dashboard')" id="btn-dashboard" class="nav-btn w-full flex items-center gap-4 px-6 py-4 rounded-2xl font-bold text-slate-500"><i data-lucide="bar-chart-3"></i> PAINEL</button>
                <button onclick="switchTab('estoque')" id="btn-estoque" class="nav-btn w-full flex items-center gap-4 px-6 py-4 rounded-2xl font-bold text-slate-500"><i data-lucide="package"></i> ESTOQUE/SERV</button>
                <button onclick="switchTab('financeiro')" id="btn-financeiro" class="nav-btn w-full flex items-center gap-4 px-6 py-4 rounded-2xl font-bold text-slate-500"><i data-lucide="wallet"></i> FINANCEIRO</button>
                <button onclick="switchTab('config')" id="btn-config" class="nav-btn w-full flex items-center gap-4 px-6 py-4 rounded-2xl font-bold text-slate-500"><i data-lucide="users"></i> EQUIPE/CLI</button>
            </nav>
        </aside>

        <main class="flex-1 p-6 lg:p-16">
            
            <div id="tab-vendas" class="tab-content">
                <div class="max-w-xl mx-auto glass p-10 rounded-[3rem]">
                    <h3 class="text-2xl font-black text-white text-center uppercase italic mb-10">Lançamento</h3>
                    <form id="form-venda" class="space-y-5">
                        <div class="grid grid-cols-2 gap-4">
                            <select id="venda-barbeiro" class="bg-black border border-white/10 p-5 rounded-2xl text-white font-bold outline-none" required></select>
                            <select id="venda-cliente" class="bg-black border border-white/10 p-5 rounded-2xl text-white italic outline-none"></select>
                        </div>
                        <div class="flex gap-2">
                            <input type="text" id="venda-descricao" list="lista-itens-datalist" oninput="autoPreco()" placeholder="O que foi feito?" class="flex-1 bg-black border border-white/10 p-5 rounded-2xl text-white font-bold outline-none">
                            <input type="number" id="venda-qtd" value="1" min="1" class="w-20 bg-black border border-white/10 p-5 rounded-2xl text-white text-center font-black outline-none">
                            <button type="button" onclick="addCarrinho()" class="bg-white text-black px-6 rounded-2xl font-black text-xl">+</button>
                        </div>
                        <datalist id="lista-itens-datalist"></datalist>
                        <div id="carrinho-visual" class="hidden space-y-2 border-y border-white/5 py-4"></div>
                        <div class="grid grid-cols-2 gap-4">
                            <input type="number" id="venda-valor" placeholder="R$ Total" step="0.01" class="bg-black border border-white/10 p-5 rounded-2xl text-white font-black text-xl" required>
                            <select id="venda-pagamento" class="bg-black border border-white/10 p-5 rounded-2xl text-white font-bold outline-none" required>
                                <option value="Pix">Pix</option><option value="Dinheiro">Dinheiro</option><option value="Cartão">Cartão</option>
                            </select>
                        </div>
                        <button type="submit" id="btn-salvar-venda" class="w-full py-6 bg-white text-black font-black rounded-2xl uppercase">Salvar Venda</button>
                    </form>
                </div>
            </div>

            <div id="tab-dashboard" class="tab-content hidden">
                <div class="flex flex-wrap gap-3 mb-8 justify-center items-end">
                    <input type="date" id="filtro-inicio" class="bg-black border border-white/10 p-3 rounded-xl text-xs text-white outline-none">
                    <input type="date" id="filtro-fim" class="bg-black border border-white/10 p-3 rounded-xl text-xs text-white outline-none">
                    <button onclick="renderizarTudo()" class="bg-white text-black px-6 py-3 rounded-xl font-black text-[10px] uppercase">Filtrar</button>
                </div>
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-10 text-center">
                    <div class="glass p-6 rounded-3xl"><p class="text-[8px] text-slate-500 font-black uppercase mb-1">Bruto</p><h4 id="dash-faturamento" class="text-xl font-black text-white">R$ 0,00</h4></div>
                    <div class="glass p-6 rounded-3xl"><p class="text-[8px] text-emerald-500 font-black uppercase mb-1">Comissões</p><h4 id="dash-comissoes" class="text-xl font-black text-emerald-500">R$ 0,00</h4></div>
                    <div class="glass p-6 rounded-3xl"><p class="text-[8px] text-rose-500 font-black uppercase mb-1">Gastos</p><h4 id="dash-despesas" class="text-xl font-black text-rose-500">R$ 0,00</h4></div>
                    <div class="glass p-6 rounded-3xl bg-white/5"><p class="text-[8px] text-white font-black uppercase mb-1">Líquido</p><h4 id="dash-casa" class="text-xl font-black text-white italic">R$ 0,00</h4></div>
                </div>
                <div id="log-agrupado" class="space-y-6"></div>
            </div>

            <div id="tab-estoque" class="tab-content hidden">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-2xl font-black text-white uppercase italic">Serviços</h3>
                    <button onclick="abrirEditor('novo_servico')" class="bg-white text-black px-5 py-2 rounded-xl font-black text-[9px] uppercase">Novo Serviço +</button>
                </div>
                <div id="lista-servicos" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-12"></div>

                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-2xl font-black text-white uppercase italic">Produtos / Estoque</h3>
                    <button onclick="abrirEditor('novo_item')" class="bg-white text-black px-5 py-2 rounded-xl font-black text-[9px] uppercase">Novo Produto +</button>
                </div>
                <div id="lista-produtos" class="grid grid-cols-1 md:grid-cols-4 gap-4"></div>
            </div>

            <div id="tab-financeiro" class="tab-content hidden">
                <div class="flex justify-between items-center mb-8 text-center">
                    <h3 class="text-xl font-black text-white uppercase italic">Saídas</h3>
                    <button onclick="abrirEditor('nova_despesa')" class="bg-rose-600 text-white px-6 py-3 rounded-xl font-black text-[10px] uppercase">Registrar Gasto</button>
                </div>
                <div id="lista-despesas" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
            </div>

            <div id="tab-config" class="tab-content hidden">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-black text-white uppercase italic">Barbeiros</h3>
                    <button onclick="abrirEditor('novo_barbeiro')" class="bg-white text-black px-5 py-2 rounded-xl font-black text-[9px] uppercase">Novo Barbeiro +</button>
                </div>
                <div id="lista-equipe" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-12"></div>

                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-black text-white uppercase italic">Clientes</h3>
                    <button onclick="abrirEditor('novo_cliente')" class="bg-white text-black px-5 py-2 rounded-xl font-black text-[9px] uppercase">Novo Cliente +</button>
                </div>
                <div id="lista-clientes" class="grid grid-cols-1 md:grid-cols-4 gap-4"></div>
            </div>

        </main>
    </div>

    <script>
        lucide.createIcons();
        const _supabase = supabase.createClient("https://uijaesuqgnchafnrvnih.supabase.co", "sb_publishable_Ukmk4J2mCb_CRhdgs_qKWA_Z0c5WIgG");
        const SENHA_ENTRADA = "cortoupagou", SENHA_ADMIN = "81120824";
        let DB = { vendas: [], clientes: [], estoque: [], barbeiros: [], despesas: [], servicos: [] };
        let carrinho = [];

        const TABELA_GANHOS = { "corte": 20.0, "corte barba": 32.5, "corte + barba": 32.5, "corte sobrancelha": 25.0, "pezinho": 10.0, "barba": 15.0, "sobrancelha": 7.5, "alisante": 12.5, "luzes": 25.0 };

        const hoje = new Date().toISOString().split('T')[0];
        document.getElementById('filtro-inicio').value = hoje;
        document.getElementById('filtro-fim').value = hoje;

        async function carregar() { 
            const { data } = await _supabase.from('barbearia').select('*').eq('id', 1).single(); 
            if (data) { DB = data; renderizarTudo(); } 
        }
        async function salvar() { await _supabase.from('barbearia').update(DB).eq('id', 1); }

        function renderizarTudo() {
            // Dashboard e Filtros
            const inicio = document.getElementById('filtro-inicio').value;
            const fim = document.getElementById('filtro-fim').value;
            const vF = (DB.vendas || []).filter(v => v.data >= inicio && v.data <= fim);
            const dF = (DB.despesas || []).filter(d => d.data >= inicio && d.data <= fim);

            let fatG = 0, comG = 0, desG = 0;
            const logA = document.getElementById('log-agrupado'); logA.innerHTML = '';
            dF.forEach(d => desG += parseFloat(d.valor || 0));

            (DB.barbeiros || []).forEach(barb => {
                const vB = vF.filter(v => v.barbeiro === barb.nome);
                if(vB.length === 0) return;
                let fatB = 0, comB = 0, listaHTML = '';
                vB.forEach((v, idx) => {
                    const vV = parseFloat(v.valor || 0), cV = calcularComissao(v.descricao);
                    fatB += vV; comB += cV;
                    listaHTML += `<div class="flex justify-between items-center py-3 border-b border-white/5 last:border-0">
                        <div><p class="text-white text-[10px] font-black uppercase italic">${v.descricao}</p><p class="text-[7px] text-slate-500 uppercase">${v.pagamento}</p></div>
                        <div class="flex items-center gap-4"><p class="text-emerald-500 font-black text-[11px]">R$ ${cV.toFixed(2)}</p>
                        <button onclick="deletarVenda('${v.data}', '${v.barbeiro}', '${v.descricao}')" class="text-rose-900 hover:text-rose-500 transition-colors"><i data-lucide="trash-2" size="12"></i></button></div>
                    </div>`;
                });
                fatG += fatB; comG += comB;
                logA.innerHTML += `<div class="glass p-8 rounded-[2.5rem] border border-white/5"><div class="flex justify-between items-end mb-6 border-b border-white/10 pb-4"><div><h4 class="text-white font-black uppercase italic text-xl">${barb.nome}</h4><p class="text-[8px] text-slate-500 font-black uppercase">Faturamento</p></div><p class="text-emerald-500 font-black text-2xl">R$ ${comB.toFixed(2)}</p></div>${listaHTML}</div>`;
            });

            document.getElementById('dash-faturamento').innerText = "R$ " + fatG.toFixed(2);
            document.getElementById('dash-comissoes').innerText = "R$ " + comG.toFixed(2);
            document.getElementById('dash-despesas').innerText = "R$ " + desG.toFixed(2);
            document.getElementById('dash-casa').innerText = "R$ " + (fatG - comG - desG).toFixed(2);

            // Listas de Gestão
            renderizarEstoque();
            renderizarEquipeClientes();
            
            // Dropdowns
            document.getElementById('venda-barbeiro').innerHTML = '<option value="">BARBEIRO...</option>' + (DB.barbeiros || []).map(b => `<option value="${b.nome}">${b.nome.toUpperCase()}</option>`).join('');
            document.getElementById('venda-cliente').innerHTML = '<option value="">CLIENTE...</option>' + (DB.clientes || []).map(c => `<option value="${c.nome}">${c.nome.toUpperCase()}</option>`).join('');
            const listaDatalist = [...(DB.servicos || []), ...(DB.estoque || [])];
            document.getElementById('lista-itens-datalist').innerHTML = listaDatalist.map(i => `<option value="${i.nome}">`).join('');
            
            lucide.createIcons();
        }

        function renderizarEstoque() {
            // Serviços
            const servL = document.getElementById('lista-servicos'); servL.innerHTML = '';
            (DB.servicos || []).forEach(s => {
                servL.innerHTML += `<div class="card-item p-5 rounded-2xl flex justify-between items-center"><div><p class="text-[10px] text-white font-black uppercase italic">${s.nome}</p><p class="text-[8px] text-slate-500 font-bold uppercase">Base R$ ${s.preco}</p></div><div class="flex gap-3"><button onclick="abrirEditor('servico', ${s.id})" class="text-slate-500 hover:text-white"><i data-lucide="edit-3" size="14"></i></button><button onclick="deletarItem('servicos', ${s.id})" class="text-rose-900 hover:text-rose-500"><i data-lucide="trash-2" size="14"></i></button></div></div>`;
            });
            // Produtos
            const prodL = document.getElementById('lista-produtos'); prodL.innerHTML = '';
            (DB.estoque || []).forEach(p => {
                prodL.innerHTML += `<div class="card-item p-5 rounded-2xl flex justify-between items-center"><div><p class="text-[10px] text-white font-black uppercase italic">${p.nome}</p><p class="text-[8px] text-slate-500 font-bold uppercase">${p.quantidade} UN em estoque</p></div><div class="flex gap-3"><button onclick="abrirEditor('item', ${p.id})" class="text-slate-500 hover:text-white"><i data-lucide="edit-3" size="14"></i></button><button onclick="deletarItem('estoque', ${p.id})" class="text-rose-900 hover:text-rose-500"><i data-lucide="trash-2" size="14"></i></button></div></div>`;
            });
        }

        function renderizarEquipeClientes() {
            const eqL = document.getElementById('lista-equipe'); eqL.innerHTML = '';
            (DB.barbeiros || []).forEach(b => {
                eqL.innerHTML += `<div class="card-item p-5 rounded-2xl flex justify-between items-center"><p class="text-[10px] text-white font-black uppercase">${b.nome}</p><div class="flex gap-3"><button onclick="abrirEditor('barbeiro', ${b.id})" class="text-slate-500 hover:text-white"><i data-lucide="edit-3" size="14"></i></button><button onclick="deletarItem('barbeiros', ${b.id})" class="text-rose-900 hover:text-rose-500"><i data-lucide="trash-2" size="14"></i></button></div></div>`;
            });
            const clL = document.getElementById('lista-clientes'); clL.innerHTML = '';
            (DB.clientes || []).forEach(c => {
                clL.innerHTML += `<div class="card-item p-5 rounded-2xl flex justify-between items-center"><p class="text-[10px] text-white font-black uppercase">${c.nome}</p><div class="flex gap-3"><button onclick="abrirEditor('cliente', ${c.id})" class="text-slate-500 hover:text-white"><i data-lucide="edit-3" size="14"></i></button><button onclick="deletarItem('clientes', ${c.id})" class="text-rose-900 hover:text-rose-500"><i data-lucide="trash-2" size="14"></i></button></div></div>`;
            });
        }

        function abrirEditor(tipo, id = null) {
            const campos = document.getElementById('editor-campos'), tit = document.getElementById('editor-titulo'), btn = document.getElementById('btn-salvar-editor');
            campos.innerHTML = ''; document.getElementById('modal-editor').style.display = 'flex';
            
            let dataObj = id ? (DB[tipo === 'servico' ? 'servicos' : tipo === 'item' ? 'estoque' : tipo+'s'].find(x => x.id == id)) : {nome:'', preco:0, quantidade:0};
            tit.innerText = tipo.toUpperCase();

            if(tipo.includes('novo_')) { 
                let base = tipo.replace('novo_', '');
                tit.innerText = "NOVO " + base.toUpperCase();
                campos.innerHTML = `<input id="ed-n" placeholder="Nome" class="w-full bg-black border border-white/10 p-5 rounded-2xl text-white outline-none">`;
                if(base === 'item' || base === 'servico') campos.innerHTML += `<input id="ed-p" type="number" placeholder="Preço" class="w-full bg-black border border-white/10 p-5 rounded-2xl text-white outline-none font-black">`;
                if(base === 'item') campos.innerHTML += `<input id="ed-q" type="number" placeholder="Quantidade" class="w-full bg-black border border-white/10 p-5 rounded-2xl text-white outline-none font-black">`;
                
                btn.onclick = async () => {
                    let colecao = base === 'item' ? 'estoque' : base === 'servico' ? 'servicos' : base + 's';
                    DB[colecao].push({id: Date.now(), nome: document.getElementById('ed-n').value, preco: document.getElementById('ed-p')?.value || 0, quantidade: document.getElementById('ed-q')?.value || 0});
                    fecharModais(); await salvar(); renderizarTudo();
                };
            } else {
                campos.innerHTML = `<input id="ed-n" value="${dataObj.nome}" class="w-full bg-black border border-white/10 p-5 rounded-2xl text-white outline-none">`;
                if(dataObj.preco !== undefined) campos.innerHTML += `<input id="ed-p" type="number" value="${dataObj.preco}" class="w-full bg-black border border-white/10 p-5 rounded-2xl text-white outline-none font-black">`;
                if(dataObj.quantidade !== undefined) campos.innerHTML += `<input id="ed-q" type="number" value="${dataObj.quantidade}" class="w-full bg-black border border-white/10 p-5 rounded-2xl text-white outline-none font-black">`;
                
                btn.onclick = async () => {
                    let colecao = tipo === 'item' ? 'estoque' : tipo === 'servico' ? 'servicos' : tipo + 's';
                    let idx = DB[colecao].findIndex(x => x.id == id);
                    DB[colecao][idx] = {...DB[colecao][idx], nome: document.getElementById('ed-n').value, preco: document.getElementById('ed-p')?.value || 0, quantidade: document.getElementById('ed-q')?.value || 0};
                    fecharModais(); await salvar(); renderizarTudo();
                };
            }
        }

        async function deletarItem(colecao, id) { if(confirm("Deletar permanentemente?")) { DB[colecao] = DB[colecao].filter(x => x.id != id); await salvar(); renderizarTudo(); } }
        async function deletarVenda(data, barb, desc) { if(confirm("Remover esta venda?")) { DB.vendas = DB.vendas.filter(v => !(v.data === data && v.barbeiro === barb && v.descricao === desc)); await salvar(); renderizarTudo(); } }
        
        function calcularComissao(desc) { 
            let total = 0; (desc || "").split(', ').forEach(item => { let n = item.trim().toLowerCase(); total += TABELA_GANHOS[n] || 0; }); return total; 
        }

        function autoPreco() {
            const item = [...(DB.servicos || []), ...(DB.estoque || [])].find(i => i.nome.toLowerCase() === document.getElementById('venda-descricao').value.toLowerCase());
            if(item) document.getElementById('venda-valor').value = item.preco;
        }

        function addCarrinho() {
            const d = document.getElementById('venda-descricao'), v = document.getElementById('venda-valor'), q = document.getElementById('venda-qtd');
            if(!d.value) return;
            for(let i=0; i < (parseInt(q.value) || 1); i++) { carrinho.push({ nome: d.value, preco: parseFloat(v.value) || 0 }); }
            d.value = ''; q.value = "1"; atualizarCarrinhoVisual();
        }

        function atualizarCarrinhoVisual() {
            const cV = document.getElementById('carrinho-visual'), vV = document.getElementById('venda-valor');
            if(carrinho.length === 0) { cV.classList.add('hidden'); return; }
            cV.classList.remove('hidden');
            cV.innerHTML = carrinho.map((i, idx) => `<div class="flex justify-between items-center text-[9px] font-black italic bg-white/5 p-3 rounded-xl"><span>${i.nome.toUpperCase()}</span><button type="button" onclick="carrinho.splice(${idx},1); atualizarCarrinhoVisual()" class="text-rose-500">REMOVER</button></div>`).join('');
            let t = 0; carrinho.forEach(i => t += i.preco); vV.value = t.toFixed(2);
        }

        function switchTab(t) {
            if(['dashboard', 'estoque', 'config', 'financeiro'].includes(t) && sessionStorage.getItem('is_admin') !== 'true') { document.getElementById('modal-senha').style.display = 'flex'; return; }
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            document.getElementById('tab-' + t).classList.remove('hidden');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active-tab'));
            document.getElementById('btn-' + t).classList.add('active-tab');
            lucide.createIcons();
        }

        function verificarSenhaEntrada() { if(document.getElementById('input-senha-entrada').value === SENHA_ENTRADA) document.getElementById('modal-bloqueio-total').style.display = 'none'; }
        function confirmarSenhaAdmin() { if(document.getElementById('input-senha-admin').value === SENHA_ADMIN) { sessionStorage.setItem('is_admin', 'true'); fecharModais(); switchTab('dashboard'); } }
        function fecharModais() { document.querySelectorAll('.modal').forEach(m => { if(m.id !== 'modal-bloqueio-total') m.style.display = 'none'; }); }

        document.getElementById('form-venda').addEventListener('submit', async function(e) {
            e.preventDefault(); const btn = document.getElementById('btn-salvar-venda');
            if(carrinho.length === 0 && document.getElementById('venda-descricao').value) addCarrinho();
            if(carrinho.length === 0) return;
            btn.disabled = true; btn.innerText = "SALVANDO...";
            DB.vendas.push({ barbeiro: document.getElementById('venda-barbeiro').value, cliente: document.getElementById('venda-cliente').value, descricao: carrinho.map(i => i.nome).join(', '), valor: document.getElementById('venda-valor').value, pagamento: document.getElementById('venda-pagamento').value, data: hoje });
            carrinho.forEach(item => {
                const idx = DB.estoque.findIndex(e => e.nome.toLowerCase() === item.nome.toLowerCase());
                if(idx !== -1) DB.estoque[idx].quantidade = Math.max(0, DB.estoque[idx].quantidade - 1);
            });
            await salvar(); this.reset(); carrinho = []; atualizarCarrinhoVisual(); renderizarTudo();
            btn.disabled = false; btn.innerText = "Salvar Venda";
        });

        carregar();
    </script>
</body>
</html>
