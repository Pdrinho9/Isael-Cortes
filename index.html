<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isael Alves Cortes - Gestão Premium</title>
    <link rel="icon" type="image/png" href="Logo.png" />
    <link rel="apple-touch-icon" href="Logo.png" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; scroll-behavior: smooth; padding-bottom: 100px; background: #000000; color: #cbd5e1; }
        .glass { background: rgba(18, 18, 18, 0.8); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .active-tab { background: #ffffff !important; color: #000000 !important; font-weight: 900; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 500; align-items: center; justify-content: center; backdrop-filter: blur(12px); padding: 20px; }
        #modal-bloqueio-total { display: flex; z-index: 999; } 
        .brand-logo { width: 120px; height: 120px; object-fit: cover; border-radius: 50%; border: 2px solid rgba(255,255,255,0.1); margin: 0 auto 2rem auto; display: block; }
        input[type="date"] { color-scheme: dark; cursor: pointer; }
        .accordion-content { max-height: 0; overflow: hidden; transition: all 0.3s ease-out; opacity: 0; }
        .accordion-content.open { max-height: 2000px; opacity: 1; padding-bottom: 1rem; }
        @media (min-width: 1024px) { body { padding-bottom: 0; } }
    </style>
</head>
<body class="min-h-screen">

    <div id="modal-bloqueio-total" class="modal">
        <div class="glass p-8 rounded-[2.5rem] w-full max-w-xs text-center border-white/20">
            <img src="Logo.png" alt="Logo" class="w-20 h-20 mx-auto mb-6 rounded-full border border-white/10">
            <h3 class="text-xl font-black text-white mb-2 italic uppercase">Acesso Restrito</h3>
            <input type="password" id="input-senha-entrada" placeholder="Senha..." class="w-full bg-black border border-white/10 rounded-2xl p-4 text-white text-center text-xl mb-6 outline-none">
            <button onclick="verificarSenhaEntrada()" class="w-full py-4 bg-white text-black rounded-xl font-black uppercase text-xs">Entrar</button>
        </div>
    </div>

    <div id="modal-senha" class="modal">
        <div class="glass p-8 rounded-[2.5rem] w-full max-w-xs text-center">
            <h3 class="text-xl font-black text-white mb-4 italic uppercase">Área do Dono</h3>
            <input type="password" id="input-senha-admin" placeholder="••••" class="w-full bg-black border border-white/10 rounded-2xl p-4 text-white text-center text-2xl mb-6 outline-none">
            <div class="flex gap-3">
                <button onclick="fecharModais()" class="flex-1 py-3 text-slate-500 font-bold text-xs uppercase">Sair</button>
                <button onclick="confirmarSenhaAdmin()" class="flex-1 py-3 bg-white text-black rounded-xl font-black uppercase text-xs">Liberar</button>
            </div>
        </div>
    </div>

    <div id="modal-editor" class="modal">
        <div class="glass p-8 rounded-[3rem] w-full max-w-md border-white/10">
            <h3 id="editor-titulo" class="text-2xl font-black text-white mb-6 text-center italic uppercase">Editor</h3>
            <div id="seletor-tipo" class="flex gap-2 mb-6" style="display: none;">
                <button onclick="setTipoNovoItem('Serviço')" id="tipo-servico" class="flex-1 py-3 rounded-xl border border-white/10 text-[10px] font-black uppercase">Serviço</button>
                <button onclick="setTipoNovoItem('Produto')" id="tipo-produto" class="flex-1 py-3 rounded-xl border border-white/10 text-[10px] font-black uppercase">Produto</button>
            </div>
            <div id="editor-campos" class="space-y-4"></div>
            <div class="flex flex-col gap-3 mt-10">
                <div class="flex gap-3">
                    <button onclick="fecharModais()" class="flex-1 py-4 bg-white/5 rounded-2xl font-bold text-xs text-slate-500 uppercase">Cancelar</button>
                    <button id="btn-salvar-editor" class="flex-1 py-4 bg-white text-black rounded-2xl font-black uppercase text-xs">Salvar</button>
                </div>
                <button id="btn-excluir-item" class="w-full py-3 text-rose-600 font-bold text-[10px] uppercase border border-rose-600/20 rounded-xl">Remover</button>
            </div>
        </div>
    </div>

    <div class="flex min-h-screen">
        <aside class="w-72 bg-black border-r border-white/5 p-8 hidden lg:flex flex-col sticky top-0 h-screen z-50">
            <img src="Logo.png" alt="Logo" class="brand-logo">
            <nav class="space-y-3 flex-1">
                <button onclick="switchTab('vendas')" id="btn-vendas" class="nav-btn w-full flex items-center gap-4 px-6 py-4 rounded-2xl font-black active-tab"><i data-lucide="plus-square"></i> NOVO</button>
                <button onclick="switchTab('dashboard')" id="btn-dashboard" class="nav-btn w-full flex items-center gap-4 px-6 py-4 rounded-2xl font-bold text-slate-500 hover:bg-white/5"><i data-lucide="bar-chart-3"></i> PAINEL</button>
                <button onclick="switchTab('financeiro')" id="btn-financeiro" class="nav-btn w-full flex items-center gap-4 px-6 py-4 rounded-2xl font-bold text-slate-500 hover:bg-white/5"><i data-lucide="wallet"></i> FINANCEIRO</button>
                <button onclick="switchTab('clientes')" id="btn-clientes" class="nav-btn w-full flex items-center gap-4 px-6 py-4 rounded-2xl font-bold text-slate-500 hover:bg-white/5"><i data-lucide="users"></i> CLIENTES</button>
                <button onclick="switchTab('estoque')" id="btn-estoque" class="nav-btn w-full flex items-center gap-4 px-6 py-4 rounded-2xl font-bold text-slate-500 hover:bg-white/5"><i data-lucide="package"></i> ESTOQUE</button>
                <button onclick="switchTab('config')" id="btn-config" class="nav-btn w-full flex items-center gap-4 px-6 py-4 rounded-2xl font-bold text-slate-500 hover:bg-white/5"><i data-lucide="settings"></i> EQUIPE</button>
            </nav>
            <button id="btn-logout-admin" onclick="logoutAdmin()" class="mt-auto flex items-center gap-4 px-6 py-4 text-rose-500 font-black text-[10px] uppercase italic hidden"><i data-lucide="log-out"></i> SAIR ADMIN</button>
        </aside>

        <main class="flex-1 p-4 lg:p-16">
            <div id="tab-vendas" class="tab-content">
                <div class="max-w-xl mx-auto glass p-8 lg:p-14 rounded-[3rem]">
                    <h3 class="text-2xl font-black text-white mb-8 text-center uppercase italic">Novo Lançamento</h3>
                    <form id="form-venda" class="space-y-5">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <select id="venda-barbeiro" class="bg-black border border-white/10 p-4 rounded-2xl text-white outline-none font-bold" required></select>
                            <select id="venda-cliente" class="bg-black border border-white/10 p-4 rounded-2xl text-white outline-none italic"></select>
                        </div>
                        <div class="flex flex-col md:flex-row gap-2">
                            <input type="text" id="venda-descricao" list="lista-itens-datalist" oninput="atualizarPrecoAutomatico()" placeholder="Item ou Serviço..." class="flex-1 bg-black border border-white/10 p-4 rounded-2xl text-white outline-none font-bold">
                            <div class="flex gap-2">
                                <input type="number" id="venda-qtd" value="1" min="1" class="w-20 bg-black border border-white/10 p-4 rounded-2xl text-white text-center font-bold outline-none">
                                <button type="button" onclick="adicionarItemAoCarrinho()" class="bg-white text-black px-6 py-4 rounded-2xl font-black text-xl">+</button>
                            </div>
                        </div>
                        <datalist id="lista-itens-datalist"></datalist>
                        <div id="carrinho-venda" class="space-y-2 hidden border-y border-white/5 py-4"></div>
                        <div class="grid grid-cols-2 gap-4">
                            <input type="number" id="venda-valor" placeholder="R$ Total" step="0.01" class="bg-black border border-white/10 p-4 rounded-2xl text-white outline-none font-black" required>
                            <select id="venda-pagamento" class="bg-black border border-white/10 p-4 rounded-2xl text-white outline-none font-bold" required>
                                <option value="">Pagamento...</option><option value="Pix">Pix</option><option value="Cartão">Cartão</option><option value="Dinheiro">Dinheiro</option>
                            </select>
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="text-[9px] text-slate-500 font-black uppercase ml-2 italic">Data do Lançamento <span id="msg-lock" class="text-rose-500">(Somente Admin)</span></label>
                            <input type="date" id="venda-data-retroativa" disabled class="w-full bg-black border border-white/10 p-4 rounded-2xl text-white font-bold outline-none italic">
                        </div>
                        <button type="submit" id="btn-finalizar-venda" class="w-full py-5 bg-white text-black font-black rounded-2xl uppercase shadow-xl hover:bg-slate-200 transition-all">Finalizar</button>
                    </form>
                </div>
            </div>

            <div id="tab-dashboard" class="tab-content hidden">
                <header class="flex flex-col gap-4 mb-8">
                    <div class="flex justify-between items-center w-full">
                        <h2 class="text-2xl font-black text-white uppercase italic">Painel</h2>
                        <select id="filtro-tempo" onchange="toggleFiltroData()" class="bg-white text-black text-[10px] font-black rounded-xl px-4 py-2 uppercase italic outline-none">
                            <option value="dia">Por Data</option>
                            <option value="periodo">Por Período</option>
                            <option value="total">Geral</option>
                        </select>
                    </div>
                    <div id="area-filtros-data" class="flex flex-wrap gap-2 items-center bg-white/5 p-4 rounded-2xl">
                        <div id="box-data-inicio" class="flex-1 min-w-[140px]">
                            <p class="text-[8px] text-slate-500 font-black uppercase mb-1 ml-1 text-center">Início</p>
                            <input type="date" id="filtro-data" onchange="renderizarTudo()" class="w-full bg-black border border-white/10 text-white text-center text-[10px] font-black rounded-xl px-4 py-3 outline-none">
                        </div>
                        <div id="box-data-fim" class="flex-1 min-w-[140px] hidden">
                            <p class="text-[8px] text-slate-500 font-black uppercase mb-1 ml-1 text-center">Fim</p>
                            <input type="date" id="filtro-data-fim" onchange="renderizarTudo()" class="w-full bg-black border border-white/10 text-white text-center text-[10px] font-black rounded-xl px-4 py-3 outline-none">
                        </div>
                    </div>
                </header>

                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8 text-center">
                    <div class="glass p-6 rounded-3xl"><p class="text-[9px] text-slate-500 uppercase">Bruto</p><h4 id="dash-faturamento" class="text-xl font-black text-white italic">R$ 0,00</h4></div>
                    <div class="glass p-6 rounded-3xl"><p class="text-[9px] text-emerald-500 uppercase font-black">Comissões</p><h4 id="dash-comissoes" class="text-xl font-black text-emerald-500 italic">R$ 0,00</h4></div>
                    <div class="glass p-6 rounded-3xl border-blue-500/10"><p class="text-[9px] text-blue-400 uppercase font-black">Produtos</p><h4 id="dash-produtos-total" class="text-xl font-black text-blue-400 italic">R$ 0,00</h4></div>
                    <div class="glass p-6 rounded-3xl"><p class="text-[9px] text-rose-500 uppercase font-black">Casa</p><h4 id="dash-casa" class="text-xl font-black text-rose-500 italic">R$ 0,00</h4></div>
                </div>
                <div id="log-vendas-agrupado" class="space-y-4"></div>
            </div>

            <div id="tab-clientes" class="tab-content hidden"><div class="flex justify-between mb-6"> <h2 class="text-white font-black italic uppercase">Clientes</h2> <button onclick="abrirEditor('novo_cliente')" class="bg-white text-black text-[10px] font-black px-4 py-2 rounded-lg">NOVO</button> </div><div id="lista-completa-clientes" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div></div>
            <div id="tab-estoque" class="tab-content hidden"><div class="flex justify-between mb-6"> <h2 class="text-white font-black italic uppercase">Estoque</h2> <button onclick="abrirEditor('novo_produto')" class="bg-white text-black text-[10px] font-black px-4 py-2 rounded-lg">NOVO</button> </div><div class="grid grid-cols-1 md:grid-cols-2 gap-8"><div id="lista-servicos" class="space-y-3"></div><div id="lista-produtos" class="space-y-3"></div></div></div>
            <div id="tab-config" class="tab-content hidden"><div class="flex justify-between mb-6"> <h2 class="text-white font-black italic uppercase">Equipe</h2> <button onclick="abrirEditor('novo_barbeiro')" class="bg-white text-black text-[10px] font-black px-4 py-2 rounded-lg">NOVO</button> </div><div id="lista-equipe" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div></div>
            <div id="tab-financeiro" class="tab-content hidden"><div class="flex justify-between mb-6"> <h2 class="text-white font-black italic uppercase">Financeiro</h2> <button onclick="abrirEditor('novo_gasto')" class="bg-white text-black text-[10px] font-black px-4 py-2 rounded-lg">NOVO GASTO</button> </div><div id="lista-gastos" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div></div>

        </main>
    </div>
    <script>
        // CONFIGURAÇÕES E ESTADO GLOBAL
        const _supabase = supabase.createClient("https://uijaesuqgnchafnrvnih.supabase.co", "sb_publishable_Ukmk4J2mCb_CRhdgs_qKWA_Z0c5WIgG");
        const SENHA_ENTRADA = "cortoupagou";
        const SENHA_ADMIN = "81120824";

        let DB = { vendas: [], clientes: [], estoque: [], barbeiros: [], gastos: [] };
        let carrinhoTemporario = [];
        let tipoItemSelecionado = 'Serviço';
        let abaDestinoPendente = 'vendas';
        const hoje = new Date().toISOString().split('T')[0];

        const TABELA_GANHOS = {
            "corte": 20.00, "corte barba": 32.50, "corte + barba": 32.50, "corte sobrancelha": 25.00, "corte + sobrancelha": 25.00,
            "pezinho": 10.00, "barba": 15.00, "sobrancelha": 7.50, "alisante": 12.50, "corte sombra alisante": 35.00, "corte + sombra + alisante": 35.00,
            "luzes": 25.00, "corte alisante/ pigmentado": 32.50, "corte + alisante/ pigmentado": 32.50, "corte luzes": 42.50, "corte + luzes": 42.50
        };

        // FUNÇÕES DE UI
        function fecharModais() { document.querySelectorAll('.modal').forEach(m => { if(m.id !== 'modal-bloqueio-total') m.style.display = 'none'; }); }

        function toggleFiltroData() {
            const modo = document.getElementById('filtro-tempo').value;
            document.getElementById('box-data-fim').classList.toggle('hidden', modo !== 'periodo');
            document.getElementById('area-filtros-data').classList.toggle('hidden', modo === 'total');
            renderizarTudo();
        }

        function toggleBarbeiro(id) {
            const content = document.getElementById('content-' + id);
            const icon = document.getElementById('icon-' + id);
            const isOpen = content.classList.contains('open');
            
            // Fecha todos antes de abrir (opcional, para ficar mais limpo)
            document.querySelectorAll('.accordion-content').forEach(c => c.classList.remove('open'));
            document.querySelectorAll('[id^="icon-"]').forEach(i => i.style.transform = 'rotate(0deg)');

            if(!isOpen) {
                content.classList.add('open');
                icon.style.transform = 'rotate(180deg)';
            }
        }

        function verificarSenhaEntrada() {
            if(document.getElementById('input-senha-entrada').value === SENHA_ENTRADA) {
                document.getElementById('modal-bloqueio-total').style.display = 'none';
                sessionStorage.setItem('acesso_concedido', 'true');
            } else { alert("Senha incorreta!"); }
        }

        function confirmarSenhaAdmin() {
            if(document.getElementById('input-senha-admin').value === SENHA_ADMIN) {
                sessionStorage.setItem('is_admin', 'true');
                document.getElementById('venda-data-retroativa').disabled = false;
                document.getElementById('msg-lock').style.display = 'none';
                executarTrocaTab(abaDestinoPendente);
                renderizarTudo();
            } else { alert("Senha incorreta!"); }
        }

        function logoutAdmin() {
            sessionStorage.removeItem('is_admin');
            location.reload();
        }

        // COMUNICAÇÃO DATABASE
        async function carregar() {
            const { data } = await _supabase.from('barbearia').select('*').eq('id', 1).single();
            if (data) { 
                DB = data; 
                if(!DB.gastos) DB.gastos = []; 
                document.getElementById('filtro-data').value = hoje;
                document.getElementById('filtro-data-fim').value = hoje;
                document.getElementById('venda-data-retroativa').value = hoje;
                renderizarTudo(); 
            }
        }

        async function salvar() {
            const { data, error } = await _supabase.from('barbearia').update({ 
                vendas: DB.vendas, clientes: DB.clientes, estoque: DB.estoque, barbeiros: DB.barbeiros, gastos: DB.gastos 
            }).match({ id: 1 }).select();
            return !error;
        }

        // RENDERIZAÇÃO
        function renderizarTudo() {
            const filtroT = document.getElementById('filtro-tempo').value;
            const dataS = document.getElementById('filtro-data').value;
            const dataF = document.getElementById('filtro-data-fim').value;
            const logA = document.getElementById('log-vendas-agrupado');
            logA.innerHTML = '';

            let fatG = 0, comG = 0, totalProdutosG = 0;

            const vFiltradas = (DB.vendas || []).filter(v => {
                if(filtroT === 'total') return true;
                if(filtroT === 'dia') return v.data === dataS;
                if(filtroT === 'periodo') return v.data >= dataS && v.data <= dataF;
                return false;
            });

            (DB.barbeiros || []).forEach((barb, idx) => {
                const vB = vFiltradas.filter(v => v.barbeiro === barb.nome);
                if(vB.length === 0) return;

                let fatB = 0, comB = 0, prodB = 0, htmlV = '';

                vB.forEach(v => {
                    const val = parseFloat(v.valor); fatB += val;
                    const cV = calcularComissao(v.descricao); comB += cV;
                    
                    // LÓGICA DE PRODUTOS (AZUL)
                    v.descricao.split(',').forEach(itemDesc => {
                        let nomeLimpo = itemDesc.trim().toLowerCase();
                        if (nomeLimpo.includes('x ')) nomeLimpo = nomeLimpo.split('x ')[1].trim();
                        const isProd = DB.estoque.find(e => e.nome.toLowerCase() === nomeLimpo && e.tipo === 'Produto');
                        if(isProd && cV === 0) prodB += (parseFloat(isProd.preco) * (parseInt(itemDesc) || 1));
                        else if(isProd) prodB += (parseFloat(isProd.preco) * (parseInt(itemDesc) || 1));
                    });

                    htmlV += `<div class="flex justify-between items-center p-4 bg-white/[0.02] border-b border-white/5 last:border-0">
                        <div class="text-[10px] italic"><span class="text-white font-black uppercase">${v.cliente}</span> <p class="text-slate-500">${v.descricao}</p></div>
                        <div class="text-right"><p class="font-black text-white text-xs">R$ ${val.toFixed(2)}</p><p class="text-emerald-500 text-[8px] font-black">Com: R$ ${cV.toFixed(2)}</p></div>
                    </div>`;
                });

                fatG += fatB; comG += comB; totalProdutosG += prodB;

                logA.innerHTML += `<div class="glass overflow-hidden rounded-[2rem] mb-2">
                    <div onclick="toggleBarbeiro(${idx})" class="bg-white/5 p-5 flex justify-between items-center cursor-pointer">
                        <div class="flex items-center gap-3"><i data-lucide="chevron-down" id="icon-${idx}" class="text-slate-500 transition-all"></i><h4 class="text-white font-black italic uppercase">${barb.nome}</h4></div>
                        <div class="flex gap-4">
                            <div class="text-right"><p class="text-[8px] text-blue-400 font-bold uppercase">Produtos</p><p class="text-blue-400 font-black italic">R$ ${prodB.toFixed(2)}</p></div>
                            <div class="text-right"><p class="text-[8px] text-emerald-500 font-bold uppercase">Pagar</p><p class="text-emerald-500 font-black italic">R$ ${comB.toFixed(2)}</p></div>
                        </div>
                    </div>
                    <div id="content-${idx}" class="accordion-content">
                        ${htmlV}
                        <div class="p-4 text-right border-t border-white/5"><span class="text-[10px] uppercase font-bold text-rose-500">Lucro Casa: R$ ${(fatB - comB).toFixed(2)}</span></div>
                    </div>
                </div>`;
            });

            document.getElementById('dash-faturamento').innerText = "R$ " + fatG.toFixed(2);
            document.getElementById('dash-comissoes').innerText = "R$ " + comG.toFixed(2);
            document.getElementById('dash-produtos-total').innerText = "R$ " + totalProdutosG.toFixed(2);
            document.getElementById('dash-casa').innerText = "R$ " + (fatG - comG).toFixed(2);
            
            // Atualizar Selects
            document.getElementById('venda-barbeiro').innerHTML = '<option value="">Barbeiro...</option>' + DB.barbeiros.map(b => `<option value="${b.nome}">${b.nome}</option>`).join('');
            document.getElementById('venda-cliente').innerHTML = '<option value="Consumidor">Cliente...</option>' + DB.clientes.map(c => `<option value="${c.nome}">${c.nome}</option>`).join('');
            document.getElementById('lista-itens-datalist').innerHTML = (DB.estoque || []).map(i => `<option value="${i.nome}">`).join('');
            
            renderizarListasSecundarias(vFiltradas);
            lucide.createIcons();
        }

        function renderizarListasSecundarias(vendasNoPeriodo) {
            // Clientes
            const cliL = document.getElementById('lista-completa-clientes'); 
            if(cliL) { 
                cliL.innerHTML = (DB.clientes || []).map(c => `<div class="glass p-5 rounded-3xl flex justify-between items-center"><div><p class="font-black text-white text-xs uppercase italic">${c.nome}</p></div><button onclick="abrirEditor('cliente', ${c.id})" class="text-slate-600"><i data-lucide="edit-3" size="16"></i></button></div>`).join('');
            }

            // Estoque com Rendimento
            const servL = document.getElementById('lista-servicos'); 
            if(servL) {
                servL.innerHTML = (DB.estoque || []).filter(i => i.tipo === 'Serviço').map(i => {
                    let totalRendido = 0;
                    vendasNoPeriodo.forEach(v => { if(v.descricao.toLowerCase().includes(i.nome.toLowerCase())) totalRendido += parseFloat(v.valor); });
                    return `<div class="glass p-4 rounded-2xl flex justify-between"><div><p class="text-[10px] font-black uppercase italic">${i.nome}</p><p class="text-white font-bold text-xs">R$ ${parseFloat(i.preco).toFixed(2)}</p></div><div class="text-right"><p class="text-[8px] text-slate-500 uppercase">Rendimento</p><p class="text-emerald-500 font-black text-xs">R$ ${totalRendido.toFixed(2)}</p></div></div>`;
                }).join('');
            }

            const prodL = document.getElementById('lista-produtos');
            if(prodL) {
                prodL.innerHTML = (DB.estoque || []).filter(i => i.tipo === 'Produto').map(i => {
                    let qtdVendida = 0;
                    vendasNoPeriodo.forEach(v => {
                        v.descricao.split(',').forEach(d => {
                            if(d.toLowerCase().includes(i.nome.toLowerCase())) {
                                let mult = parseInt(d) || 1;
                                qtdVendida += mult;
                            }
                        });
                    });
                    const rendimento = qtdVendida * parseFloat(i.preco);
                    const corQtd = (i.quantidade || 0) <= 3 ? 'text-rose-500' : 'text-emerald-500'; 
                    return `<div class="glass p-4 rounded-2xl flex justify-between items-center">
                        <div><p class="text-[10px] font-black uppercase italic">${i.nome}</p><p class="text-blue-400 text-[9px] font-bold mt-1">Vendidos: ${qtdVendida} (R$ ${rendimento.toFixed(2)})</p></div>
                        <div class="text-right leading-none"><p class="text-[8px] text-slate-500 uppercase">Estoque</p><p class="${corQtd} font-black text-sm">${i.quantidade || 0}</p></div>
                    </div>`;
                }).join('');
            }
        }

        // LÓGICA DE VENDAS E CARRINHO
        function adicionarItemAoCarrinho() {
            const d = document.getElementById('venda-descricao'); const q = document.getElementById('venda-qtd'); const v = document.getElementById('venda-valor');
            if(!d.value) return; 
            const qtd = parseInt(q.value) || 1; 
            const precoUnit = parseFloat(v.value) || 0;
            carrinhoTemporario.push({ nome: qtd > 1 ? `${qtd}x ${d.value}` : d.value, preco: precoUnit * qtd, original: d.value, qtd: qtd });
            d.value = ''; q.value = '1'; atualizarVisualCarrinho();
        }

        function atualizarVisualCarrinho() {
            const cont = document.getElementById('carrinho-venda'); const t = document.getElementById('venda-valor');
            if(carrinhoTemporario.length === 0) { cont.classList.add('hidden'); t.value = ''; return; }
            cont.classList.remove('hidden'); 
            let total = 0;
            cont.innerHTML = carrinhoTemporario.map((item, idx) => { 
                total += item.preco; 
                return `<div class="flex justify-between items-center bg-white/5 p-3 rounded-xl italic text-[10px]"><span>${item.nome}</span><button type="button" onclick="removerItemCarrinho(${idx})" class="text-rose-500"><i data-lucide="x" size="14"></i></button></div>`; 
            }).join('');
            t.value = total.toFixed(2); lucide.createIcons();
        }

        function removerItemCarrinho(idx) { carrinhoTemporario.splice(idx, 1); atualizarVisualCarrinho(); }

        function calcularComissao(descricao) {
            let total = 0;
            descricao.split(',').forEach(p => {
                let nome = p.trim().toLowerCase();
                let mult = 1;
                if (nome.includes('x ')) { const aux = nome.split('x '); mult = parseInt(aux[0]) || 1; nome = aux[1].trim(); }
                if (TABELA_GANHOS[nome] !== undefined) total += (TABELA_GANHOS[nome] * mult);
            });
            return total;
        }

        function atualizarPrecoAutomatico() { 
            const i = DB.estoque.find(i => i.nome.toLowerCase() === document.getElementById('venda-descricao').value.toLowerCase()); 
            if(i) document.getElementById('venda-valor').value = i.preco; 
        }

        function switchTab(t) { 
            if(['dashboard', 'estoque', 'config', 'financeiro'].includes(t)) { 
                if(sessionStorage.getItem('is_admin') === 'true') executarTrocaTab(t); 
                else { abaDestinoPendente = t; document.getElementById('modal-senha').style.display = 'flex'; } 
            } else executarTrocaTab(t); 
        }

        function executarTrocaTab(t) { 
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden')); 
            document.getElementById('tab-' + t).classList.remove('hidden'); 
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active-tab'));
            if(document.getElementById('btn-' + t)) document.getElementById('btn-' + t).classList.add('active-tab');
            fecharModais(); 
            lucide.createIcons(); 
        }

        // EVENTOS
        document.getElementById('form-venda').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-finalizar-venda');
            if(carrinhoTemporario.length === 0) return;
            
            btn.disabled = true; btn.innerText = "SALVANDO...";
            
            carrinhoTemporario.forEach(item => {
                const idx = DB.estoque.findIndex(e => e.nome.toLowerCase() === item.original.toLowerCase());
                if(idx !== -1 && DB.estoque[idx].tipo === 'Produto') DB.estoque[idx].quantidade = (DB.estoque[idx].quantidade || 0) - item.qtd;
            });

            DB.vendas.push({
                barbeiro: document.getElementById('venda-barbeiro').value,
                cliente: document.getElementById('venda-cliente').value,
                descricao: carrinhoTemporario.map(i => i.nome).join(', '),
                valor: document.getElementById('venda-valor').value,
                pagamento: document.getElementById('venda-pagamento').value,
                data: document.getElementById('venda-data-retroativa').value,
                hora: new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'})
            });

            if (await salvar()) {
                this.reset();
                carrinhoTemporario = [];
                document.getElementById('venda-data-retroativa').value = hoje;
                atualizarVisualCarrinho();
                renderizarTudo();
                alert("Sucesso!");
            }
            btn.disabled = false; btn.innerText = "FINALIZAR";
        });

        window.onload = carregar;
    </script>
</body>
</html>
